<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRIP I</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F1EA;
    --card: #FFFFFF;
    --ink: #1D2B2F;
    --sub: #5D6B6E;
    --line: #E3DDD2;
    --accent: #0E7C70;
    --accent-ink: #FFFFFF;
    --accent-soft: #DCEFEB;
    --coral: #D4553A;
    --coral-soft: #FBE3DB;
    --gold-soft: #F7EDCF;
    --gold-ink: #7A5A0B;
    --shadow: 0 6px 20px rgba(29, 43, 47, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101719;
      --card: #182224;
      --ink: #E6ECEB;
      --sub: #9AA9A8;
      --line: #2A3638;
      --accent: #48B3A3;
      --accent-ink: #0B1414;
      --accent-soft: #1E3633;
      --coral: #F08A6C;
      --coral-soft: #3A2520;
      --gold-soft: #332C17;
      --gold-ink: #E8C76A;
      --shadow: 0 6px 20px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #101719;
    --card: #182224;
    --ink: #E6ECEB;
    --sub: #9AA9A8;
    --line: #2A3638;
    --accent: #48B3A3;
    --accent-ink: #0B1414;
    --accent-soft: #1E3633;
    --coral: #F08A6C;
    --coral-soft: #3A2520;
    --gold-soft: #332C17;
    --gold-ink: #E8C76A;
    --shadow: 0 6px 20px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans KR", system-ui, -apple-system, "Malgun Gothic", sans-serif;
    font-size: 15px;
    line-height: 1.55;
  }
  button, input { font: inherit; color: inherit; }
  a { color: var(--accent); }
  .app { max-width: 480px; margin: 0 auto; padding: 20px 16px 64px; }

  header.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  header.top .brand { margin-right: auto; }
  .back { width: 40px; height: 40px; margin: 0 6px 0 -8px; border: 0; border-radius: 12px; background: transparent; font-size: 22px; font-weight: 700; line-height: 1; cursor: pointer; }
  .back:hover { background: var(--accent-soft); }
  .back[hidden] { display: none; }
  .brand { font-family: "Gowun Dodum", sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
  .brand img { display: block; height: 40px; width: auto; }
  :root[data-theme="dark"] .brand img { background: #F4F6FA; border-radius: 10px; padding: 3px 8px; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brand img { background: #F4F6FA; border-radius: 10px; padding: 3px 8px; } }
  .steps { font-size: 13px; color: var(--sub); }

  .screen { display: none; }
  .screen.on { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  h1.q { font-family: "Gowun Dodum", sans-serif; font-size: 24px; line-height: 1.35; margin: 0 0 6px; }
  p.lead { color: var(--sub); margin: 0 0 20px; }

  .card {
    background: var(--card);
    border-radius: 18px;
    padding: 18px 16px;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
  }
  .card h2 { font-size: 16px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .card h2 .num {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink);
    font-size: 12px; display: inline-grid; place-items: center;
  }

  .grid-months { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1.5px solid var(--line);
    background: transparent;
    border-radius: 12px;
    padding: 10px 6px;
    cursor: pointer;
    text-align: center;
    transition: background .15s, border-color .15s;
    min-height: 44px;
  }
  .chips .chip { padding: 10px 14px; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .chip small { display: block; font-size: 11px; opacity: .75; font-weight: 400; }

  .stepper { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .stepper button {
    width: 48px; height: 48px; border-radius: 50%;
    border: 1.5px solid var(--line); background: transparent;
    font-size: 22px; cursor: pointer;
  }
  .stepper button:disabled { opacity: .35; cursor: default; }
  .stepper .val { text-align: center; flex: 1; }
  .stepper .val b { font-size: 26px; font-family: "Gowun Dodum", sans-serif; }
  .stepper .val div { font-size: 13px; color: var(--sub); }

  .btn {
    display: block; width: 100%;
    border: 0; border-radius: 14px;
    padding: 15px 16px;
    background: var(--accent); color: var(--accent-ink);
    font-weight: 700; font-size: 16px;
    cursor: pointer;
    min-height: 50px;
  }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
  .btn.coral { background: var(--coral); color: #fff; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .link-btn { background: none; border: 0; color: var(--sub); text-decoration: underline; cursor: pointer; padding: 8px 0; font-size: 14px; }

  .search {
    display: flex; align-items: center; gap: 8px;
    background: var(--card); border-radius: 16px; padding: 6px 6px 6px 14px;
    box-shadow: var(--shadow); border: 1.5px solid transparent;
  }
  .search:focus-within { border-color: var(--accent); }
  .search input { flex: 1; border: 0; outline: 0; background: transparent; font-size: 16px; padding: 8px 0; min-width: 0; }
  .search button { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 10px 14px; font-weight: 700; cursor: pointer; }

  .country { margin-top: 18px; }
  .country h3 { font-size: 13px; color: var(--sub); margin: 0 0 8px; font-weight: 500; }
  .results { margin-top: 14px; display: grid; gap: 10px; }
  .result {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border-radius: 16px; padding: 14px;
    box-shadow: var(--shadow); border: 0; text-align: left; cursor: pointer; width: 100%;
  }
  .result .flag { font-size: 26px; }
  .result b { display: block; font-size: 16px; }
  .result span { font-size: 13px; color: var(--sub); }
  .notice { background: var(--coral-soft); border-radius: 14px; padding: 14px; font-size: 14px; }

  /* 결과 화면 */
  .ticket {
    background: var(--accent); color: var(--accent-ink);
    border-radius: 18px; padding: 16px; margin-bottom: 14px; position: relative;
  }
  .ticket .city { font-family: "Gowun Dodum", sans-serif; font-size: 28px; line-height: 1.2; }
  .ticket .country-name { font-size: 13px; opacity: .85; }
  .ticket .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; padding-top: 12px; border-top: 1.5px dashed rgba(255,255,255,.45); }
  :root[data-theme="dark"] .ticket .meta { border-top-color: rgba(0,0,0,.35); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ticket .meta { border-top-color: rgba(0,0,0,.35); } }
  .ticket .meta span { background: rgba(255,255,255,.18); border-radius: 999px; padding: 4px 10px; font-size: 13px; }
  .ticket .edit { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,.2); color: inherit; border: 0; border-radius: 10px; padding: 6px 10px; font-size: 13px; cursor: pointer; }

  .tips { display: grid; gap: 8px; }
  .tip { display: flex; gap: 10px; font-size: 14px; }
  .tip .ic { flex: none; width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); font-size: 15px; }

  .tabs { display: flex; gap: 6px; overflow-x: auto; margin: 6px 0 12px; padding-bottom: 2px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; border: 1.5px solid var(--line); background: transparent; border-radius: 999px; padding: 8px 14px; cursor: pointer; font-size: 14px; }
  .tab[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 700; }

  .route-head { margin-bottom: 10px; }
  .route-head h2 { font-family: "Gowun Dodum", sans-serif; font-size: 20px; margin: 0 0 4px; }
  .route-head p { margin: 0; color: var(--sub); font-size: 14px; }
  .intro-msg { background: var(--gold-soft); color: var(--gold-ink); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; font-size: 14px; font-weight: 500; }

  .day { padding: 16px 14px 8px; }
  .day-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
  .day-head .d { font-size: 12px; font-weight: 700; color: var(--coral); letter-spacing: .5px; }
  .day-head .area { font-size: 16px; font-weight: 700; }
  .day-head a { flex: none; font-size: 12px; text-decoration: none; border: 1.5px solid var(--line); border-radius: 10px; padding: 6px 9px; color: var(--ink); white-space: nowrap; }
  ol.timeline { list-style: none; margin: 0; padding: 0; }
  ol.timeline li { display: grid; grid-template-columns: 46px 1fr; gap: 10px; position: relative; padding-bottom: 14px; }
  ol.timeline li::before { content: ""; position: absolute; left: 22px; top: 26px; bottom: 0; width: 2px; background: var(--line); }
  ol.timeline li:last-child::before { display: none; }
  .slot { font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 8px; height: 26px; display: grid; place-items: center; position: relative; z-index: 1; }
  .spot-name { font-weight: 700; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .spot-name a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--sub); }
  .spot-desc { font-size: 13px; color: var(--sub); margin-top: 2px; }
  .badge { font-size: 11px; font-weight: 700; border-radius: 6px; padding: 1px 6px; }
  .badge.must { background: var(--coral); color: #fff; }
  .badge.season { background: var(--gold-soft); color: var(--gold-ink); }
  .badge.who { background: var(--accent-soft); color: var(--accent); }
  .badge.custom { background: var(--coral-soft); color: var(--coral); }
  .placeholder .spot-name { font-weight: 500; color: var(--sub); }
  .stay h2 { font-size: 17px; }
  .stay-item { padding: 12px 0; border-top: 1px solid var(--line); }
  .stay-item:first-of-type { border-top: 0; padding-top: 0; }
  .stay-links { display: flex; gap: 14px; margin-top: 6px; font-size: 13px; }
  .stay-links a { text-decoration: none; font-weight: 500; }
  .badge.moved { background: var(--line); color: var(--ink); }
  .move-btn { margin-left: auto; flex: none; border: 1.5px solid var(--line); background: transparent; border-radius: 8px; padding: 2px 8px; font-size: 12px; color: var(--sub); cursor: pointer; min-height: 28px; }
  .move-btn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
  .move-panel { margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); }
  .move-q { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
  .move-q small { font-weight: 400; color: var(--sub); }
  .move-panel .chip { background: var(--card); }
  .move-actions { display: flex; justify-content: space-between; margin-top: 4px; }
  .travel .slot { background: var(--gold-soft); color: var(--gold-ink); }
  .travel .spot-name { font-weight: 500; }
  .day-head .sub { font-size: 12px; color: var(--gold-ink); background: var(--gold-soft); border-radius: 6px; padding: 1px 7px; display: inline-block; margin-top: 4px; }
  .nearby h2 { font-family: "Gowun Dodum", sans-serif; font-size: 20px; }
  .nb-item { padding: 14px 0; border-top: 1px solid var(--line); }
  .nb-item:first-of-type { border-top: 0; padding-top: 4px; }
  .nb-name { font-weight: 700; font-size: 16px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .nb-facts { display: grid; gap: 3px; margin: 6px 0 10px; font-size: 13px; color: var(--sub); }
  .nb-facts b { color: var(--ink); font-weight: 500; }
  .seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; }
  .seg button { border: 0; background: transparent; padding: 8px 14px; font-size: 14px; cursor: pointer; min-height: 38px; }
  .seg button + button { border-left: 1.5px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .seg button:disabled { opacity: .35; cursor: default; }
  .nb-cap { font-size: 13px; color: var(--sub); margin: 0 0 6px; }
  .gate .slot { background: var(--coral-soft); color: var(--coral); }

  .ask { border: 2px solid var(--accent); }
  .ask h2 { font-family: "Gowun Dodum", sans-serif; font-size: 20px; }
  .must-input { display: flex; gap: 8px; margin: 10px 0; }
  .must-input input { flex: 1; min-width: 0; border: 1.5px solid var(--line); background: transparent; border-radius: 12px; padding: 12px; font-size: 16px; }
  .must-input input:focus { outline: 0; border-color: var(--accent); }
  .must-input button { border: 0; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 0 16px; font-weight: 700; cursor: pointer; }
  .suggest-label { font-size: 13px; color: var(--sub); margin: 12px 0 6px; }
  .chips.small .chip { padding: 7px 11px; min-height: 36px; font-size: 13px; border-radius: 999px; }
  .picked { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 12px; }
  .picked span { background: var(--coral-soft); color: var(--coral); border-radius: 999px; padding: 6px 6px 6px 12px; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
  .picked button { border: 0; background: transparent; color: inherit; cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 6px; }
  .trip-box { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 0 0 10px; }
  .trip-box .nb-facts { margin-bottom: 0; }
  .trip-box a, .spot-desc a { color: var(--accent); }

  .refs a { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
  .refs a:last-child { border-bottom: 0; }
  .refs a span { color: var(--sub); font-size: 13px; }
  .fine { font-size: 12px; color: var(--sub); margin-top: 10px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .toast.on { opacity: 1; }

  /* 나라 색: 여행지를 고르면 <html data-country="나라">로 바꾼다. --c1 주색, --c2 보조색, 끝의 d는 다크 모드용 */
  :root[data-country="한국"]     { --c1: #0047A0; --c2: #CD2E3A; --c1d: #7EA6E8; --c2d: #F07A82; --flag: linear-gradient(90deg, #CD2E3A 0 33%, #fff 33% 67%, #0047A0 67%); }
  :root[data-country="일본"]     { --c1: #BC002D; --c2: #2B3A67; --c1d: #F2667E; --c2d: #9DB0E6; --flag: linear-gradient(90deg, #fff 0 42%, #BC002D 42% 58%, #fff 58%); }
  :root[data-country="베트남"]   { --c1: #DA251D; --c2: #8F6B00; --c1d: #F07068; --c2d: #F2C94C; --flag: linear-gradient(90deg, #DA251D 0 42%, #FFCD00 42% 58%, #DA251D 58%); }
  :root[data-country="태국"]     { --c1: #2D2A4A; --c2: #A51931; --c1d: #9C98E0; --c2d: #F07A8A; --flag: linear-gradient(90deg, #A51931 0 17%, #F4F5F8 17% 33%, #2D2A4A 33% 67%, #F4F5F8 67% 83%, #A51931 83%); }
  :root[data-country="대만"]     { --c1: #1A1F9C; --c2: #D21F2B; --c1d: #8C91F0; --c2d: #F2737B; --flag: linear-gradient(90deg, #000095 0 40%, #fff 40% 46%, #FE0000 46%); }
  :root[data-country="홍콩"]     { --c1: #C8102E; --c2: #1F5F7A; --c1d: #F27088; --c2d: #7CC4DE; --flag: linear-gradient(90deg, #DE2910 0 42%, #fff 42% 58%, #DE2910 58%); }
  :root[data-country="싱가포르"] { --c1: #D62839; --c2: #2A4A6B; --c1d: #F2737E; --c2d: #8FB4DB; --flag: linear-gradient(90deg, #EF3340 0 50%, #fff 50%); }
  :root[data-country="필리핀"]   { --c1: #0038A8; --c2: #CE1126; --c1d: #7EA2F0; --c2d: #F07484; --flag: linear-gradient(90deg, #0038A8 0 45%, #FCD116 45% 55%, #CE1126 55%); }
  :root[data-country="인도네시아"] { --c1: #CE1126; --c2: #7A5230; --c1d: #F07484; --c2d: #D9A877; --flag: linear-gradient(90deg, #CE1126 0 50%, #fff 50%); }
  :root[data-country="미국"]     { --c1: #3C3B6E; --c2: #B22234; --c1d: #A3A1E6; --c2d: #F0707E; --flag: linear-gradient(90deg, #3C3B6E 0 34%, transparent 34%), repeating-linear-gradient(90deg, #B22234 0 5.5%, #fff 5.5% 11%); }
  :root[data-country="프랑스"]   { --c1: #1F3F99; --c2: #D7263D; --c1d: #8AA2EE; --c2d: #F27583; --flag: linear-gradient(90deg, #002395 0 33.3%, #fff 33.3% 66.6%, #ED2939 66.6%); }
  :root[data-country="영국"]     { --c1: #012169; --c2: #C8102E; --c1d: #8197E0; --c2d: #F06A7E; --flag: linear-gradient(90deg, #012169 0 40%, #fff 40% 44%, #C8102E 44% 56%, #fff 56% 60%, #012169 60%); }
  :root[data-country="이탈리아"] { --c1: #00804A; --c2: #CD212A; --c1d: #4CC78A; --c2d: #F06F76; --flag: linear-gradient(90deg, #009246 0 33.3%, #fff 33.3% 66.6%, #CE2B37 66.6%); }
  :root[data-country="스페인"]   { --c1: #AA151B; --c2: #8F6B00; --c1d: #F06E73; --c2d: #F1BF00; --flag: linear-gradient(90deg, #AA151B 0 25%, #F1BF00 25% 75%, #AA151B 75%); }
  :root[data-country] {
    --accent: var(--c1);
    --accent-ink: #FFFFFF;
    --coral: var(--c2);
    --accent-soft: color-mix(in srgb, var(--c1) 12%, #FFFFFF);
    --coral-soft: color-mix(in srgb, var(--c2) 13%, #FFFFFF);
    --bg: color-mix(in srgb, var(--c1) 7%, #F6F4EF);
    --line: color-mix(in srgb, var(--c1) 16%, #E4E0D8);
  }
  @media (prefers-color-scheme: dark) {
    :root[data-country]:not([data-theme="light"]) {
      --accent: var(--c1d);
      --accent-ink: #0B1414;
      --coral: var(--c2d);
      --accent-soft: color-mix(in srgb, var(--c1d) 18%, #182224);
      --coral-soft: color-mix(in srgb, var(--c2d) 16%, #182224);
      --bg: color-mix(in srgb, var(--c1d) 8%, #0F1517);
      --line: color-mix(in srgb, var(--c1d) 18%, #2A3638);
    }
    :root[data-country]:not([data-theme="light"]) :is(.btn.coral, .badge.must) { color: var(--accent-ink); }
  }
  :root[data-country][data-theme="dark"] {
    --accent: var(--c1d);
    --accent-ink: #0B1414;
    --coral: var(--c2d);
    --accent-soft: color-mix(in srgb, var(--c1d) 18%, #182224);
    --coral-soft: color-mix(in srgb, var(--c2d) 16%, #182224);
    --bg: color-mix(in srgb, var(--c1d) 8%, #0F1517);
    --line: color-mix(in srgb, var(--c1d) 18%, #2A3638);
  }
  :root[data-country][data-theme="dark"] :is(.btn.coral, .badge.must) { color: var(--accent-ink); }
  body { transition: background-color .4s; }
  .ticket { overflow: hidden; }
  .ticket::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: var(--flag, none); }

  /* 로딩: 여행지를 고르면 구름 위를 두둥실 나는 비행기를 보여 준 뒤 루트를 보여 준다 */
  html:has(.flight.on) { overflow: hidden; }
  .flight { position: fixed; inset: 0; z-index: 100; display: none; overflow: hidden; cursor: pointer; background: linear-gradient(#4F8FE0 0%, #8EC0F0 50%, #DDEEFC 100%); }
  .flight.on { display: block; animation: flight-out .5s ease 2.3s both; }

};

const CITIES = [];
function city(id, name, country, flag, alias, areas, hi, notes, spotText) {
  const c = {
    id, name, country, flag, alias, hi, notes,
    areas: areas.map(([aid, aname, nb], i) => ({ id: aid.replace('!', ''), name: aname, trip: aid.startsWith('!'), idx: i, nb: nb || null })),
  };
  c.spots = spotText.trim().split('\n').map((line, i) => {
    const [nameField, a, k, p, who = '', desc = '', m = ''] = line.trim().split('|');
    const [rawName, g = ''] = nameField.split('#');
    const alt = rawName.startsWith('*');
    return {
      id: id + '-' + i,
      name: alt ? rawName.slice(1) : rawName,
      alt, g, a: a.replace('!', ''), k, p: Number(p),
      w: who.replace(/[A-Z]/g, ''),
      no: who.replace(/[a-z]/g, '').toLowerCase(),
      desc,
      m: m ? parseMonths(m) : null,
    };
  });
  CITIES.push(c);
}
function parseMonths(str) {
  const out = new Set();
  str.split(',').forEach(part => {
    const [a, b] = part.split('-').map(Number);
    if (!b) { out.add(a); return; }
    for (let m = a; ; m = m % 12 + 1) { out.add(m); if (m === b) break; }
  });
  return [...out];
}

function hasBatchim(word) {
  const ch = word.charCodeAt(word.length - 1);
  if (ch < 0xAC00 || ch > 0xD7A3) return false;
  return (ch - 0xAC00) % 28 !== 0;
}
const josa = (word, a, b) => word + (hasBatchim(word) ? a : b);

const mapUrl = (name, c) => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(`${name.replace(/\(.*?\)/g, '')} ${c.name.replace(/\(.*?\)/g, '')}`);

/* ------------------------------------------------------------------
   루트 만들기
------------------------------------------------------------------- */
const SLOT_ORDER = ['오전', '점심', '오후', '저녁'];
const SLOT_KINDS = { '오전': ['s'], '점심': ['f'], '오후': ['s'], '저녁': ['n', 'f'] };

function dayTemplates(days) {
  if (days === 1) return [['오전', '점심', '오후', '저녁']];
  return Array.from({ length: days }, (_, i) =>
    i === 0 ? ['점심', '오후', '저녁'] : i === days - 1 ? ['오전', '점심'] : ['오전', '점심', '오후', '저녁']);
}

function scoreSpot(s, opts, variant, avoid) {
  const must = opts.mustIds.has(s.id);
  if (!must && s.m && !s.m.includes(opts.month)) return null;
  if (!must && s.no.includes(opts.who)) return null;
  let sc = variant === 'alt'
    ? (s.alt ? 5 : 0) + s.p * 0.7 - (avoid.has(s.id) ? 8 : 0)
    : s.p * 2 - (s.alt ? 1.5 : 0);
  if (s.w.includes(opts.who)) sc += 3;
  if (s.m) sc += 4;
  if (must) sc += 100;
  return sc;
}

function buildRoute(c, opts, variant, avoid = new Set()) {
  const pool = [];
  c.spots.forEach((s, i) => {
    const sc = scoreSpot(s, opts, variant, avoid);
    if (sc !== null) pool.push({ s, sc: sc - i * 0.001, order: i });
  });
  // 비슷한 곳(같은 #그룹)은 사람들이 가장 많이 가는(인기 최고) 한 곳만 남긴다.
  // 가고 싶은 곳으로 고른 곳이 있으면 그곳을 남기고, 다른 루트는 대표 루트에 없던 곳 중에서 고른다.
  const groups = {};
  pool.forEach(x => { if (x.s.g) (groups[x.s.g] = groups[x.s.g] || []).push(x); });
  const drop = new Set();
  Object.values(groups).forEach(list => {
    if (list.length < 2) return;
    const musts = list.filter(x => opts.mustIds.has(x.s.id));
    let keep = musts;
    if (!musts.length) {
      const fresh = list.filter(x => !avoid.has(x.s.id));
      const cand = variant === 'alt' && fresh.length ? fresh : list;
      keep = [cand.slice().sort((a, b) => b.s.p - a.s.p || a.order - b.order)[0]];
    }
    list.forEach(x => { if (!keep.includes(x)) drop.add(x.s.id); });
  });
  const byArea = {};
  pool.filter(x => !drop.has(x.s.id)).forEach(x => (byArea[x.s.a] = byArea[x.s.a] || []).push(x));
  Object.values(byArea).forEach(list => list.sort((a, b) => b.sc - a.sc));
  const areaOf = id => c.areas.find(a => a.id === id);

  // 1) 날마다 머물 지역 고르기
  //    사용자가 고른 근교(opts.nearby: {지역 id: 'day' | 'night'})는 먼저 날을 떼어 두고, 그때는 자동 근교를 넣지 않는다.
  const days = opts.days;
  const nearby = opts.nearby || {};
  const forced = Object.keys(nearby).filter(id => areaOf(id) && areaOf(id).trip);
  const tripEntries = [];
  forced.forEach(id => {
    if (nearby[id] === 'night') tripEntries.push([{ area: id, part: 'nightA' }, { area: id, part: 'nightB' }]);
    else tripEntries.push([{ area: id, part: 'day' }]);
  });
  const localDays = Math.max(1, days - tripEntries.flat().length);
  const tripLimit = forced.length ? 0
    : variant === 'alt' ? Math.max(days >= 3 ? 1 : 0, Math.floor((days - 1) / 2)) : (days >= 4 ? 1 : 0);
  const sim = new Set();
  const chosen = [];
  const value = {};
  const take = aid => {
    const top = (byArea[aid] || []).filter(x => !sim.has(x.s.id)).slice(0, 3);
    top.forEach(x => sim.add(x.s.id));
    value[aid] = Math.max(value[aid] || 0, top.reduce((t, x) => t + x.sc, 0));
    chosen.push(aid);
  };
  // 가고 싶은 곳으로 고른 근교 도시(opts.mustAreas)와 가고 싶은 장소가 있는 지역은 꼭 하루씩 잡는다
  const mustAreas = [...new Set([...(opts.mustAreas || []).filter(areaOf), ...pool.filter(x => opts.mustIds.has(x.s.id)).map(x => x.s.a)])];
  mustAreas.filter(a => !forced.includes(a)).slice(0, localDays).forEach(take);
  let trips = chosen.filter(a => areaOf(a).trip).length;
  while (chosen.length < localDays) {
    let best = null, bestV = -Infinity;
    for (const a of c.areas) {
      if (a.trip && trips >= tripLimit) continue;
      const left = (byArea[a.id] || []).filter(x => !sim.has(x.s.id));
      if (!left.some(x => x.s.k.includes('s'))) continue;
      let v = left.slice(0, 3).reduce((t, x) => t + x.sc, 0);
      if (a.trip) v += variant === 'alt' ? 6 : -1;
      if (chosen.includes(a.id)) v -= 4;
      if (v > bestV) { bestV = v; best = a; }
    }
    if (!best) best = c.areas.filter(a => !a.trip)[chosen.length % c.areas.filter(a => !a.trip).length];
    take(best.id);
    if (best.trip) trips++;
  }

  // 2) 지역 순서: 가까운 순(지역 목록 순서), 근교는 가운데로.
  //    반나절뿐인 마지막 날에는 볼거리가 가장 적은 지역을, 하루 종일 걸리는 곳(테마파크)이 있는 지역은 빼고 둔다.
  const local = chosen.filter(a => !areaOf(a).trip).sort((a, b) => areaOf(a).idx - areaOf(b).idx);
  let lastArea = null;
  if (days >= 2 && local.length >= 2) {
    const allDay = a => (byArea[a] || []).slice(0, 2).some(x => x.s.k.includes('a'));
    lastArea = local.slice().sort((a, b) => (allDay(a) - allDay(b)) || (value[a] - value[b]))[0];
    local.splice(local.lastIndexOf(lastArea), 1);
  }
  chosen.filter(a => areaOf(a).trip).forEach(a => tripEntries.push([{ area: a, part: 'day' }]));
  const order = local.map(a => ({ area: a, part: 'local' }));
  let at = Math.min(order.length, Math.max(1, Math.ceil(local.length / 2)));
  tripEntries.forEach(group => { order.splice(at, 0, ...group); at += group.length; });
  if (lastArea) order.push({ area: lastArea, part: 'local' });

  // 3) 칸 채우기
  const templates = dayTemplates(days);
  const placed = new Set();
  const plan = order.map(o => ({ area: o.area, part: o.part, items: [] }));
  // 근교 날에 그 도시에서 보내는 칸: 당일은 근교 정보의 use(없으면 하루 전체),
  // 1박 첫날은 오전에 출발해 점심부터(볼거리를 이틀에 나눠 쓰도록), 둘째 날은 오전·점심
  const tripSlotsOf = (day, slots) => {
    if (day.part === 'local') return [];
    if (day.part === 'nightA') return slots.filter(s => s !== '오전');
    if (day.part === 'nightB') return slots.filter(s => s === '오전' || s === '점심');
    const use = (areaOf(day.area).nb || {}).use;
    return use ? slots.filter(s => use.includes(s)) : slots;
  };
  // 근교에서 돌아온 뒤의 칸은 시내 지역 중 점수가 가장 높은 남은 곳으로
  const findLocal = kinds => {
    const list = c.areas.filter(a => !a.trip).flatMap(a => byArea[a.id] || [])
      .filter(x => !placed.has(x.s.id) && !x.s.k.includes('a')).sort((a, b) => b.sc - a.sc);
    for (const k of kinds) { const hit = list.find(x => x.s.k.includes(k)); if (hit) return hit; }
    return null;
  };
  // 먼저 모든 날을 그날 지역으로 채우고(1차), 남은 빈칸만 바로 옆 지역에서 빌려 온다(2차).
  // 이렇게 해야 앞날이 뒷날 지역의 명소를 먼저 가져가지 않는다.
  const tiersFor = (aid, borrow) => {
    const a = areaOf(aid);
    if (!borrow) return [aid];
    if (a.trip) return [];
    return c.areas.filter(x => !x.trip && x.id !== aid && Math.abs(x.idx - a.idx) === 1).map(x => x.id);
  };
  const findSpot = (aid, kinds, fullDay, borrow) => {
    const ok = x => !placed.has(x.s.id) && (fullDay || !x.s.k.includes('a'));
    for (const tier of tiersFor(aid, borrow)) {
      const list = (byArea[tier] || []).filter(ok);
      for (const k of kinds) {
        // 낮 칸에는 야경이 아닌 곳을 먼저 (야경도 되는 곳은 저녁에 쓰이도록)
        const hit = (k === 's' && list.find(x => x.s.k.includes('s') && !x.s.k.includes('n'))) ||
          list.find(x => x.s.k.includes(k));
        if (hit) return hit;
      }
    }
    return null;
  };
  plan.forEach((day, i) => {
    const slots = templates[i];
    const tripSlots = tripSlotsOf(day, slots);
    const fullDay = ['오전', '점심', '오후'].every(s => day.part === 'local' ? slots.includes(s) : tripSlots.includes(s));
    let allDaySpot = null;
    slots.forEach(slot => {
      if (allDaySpot && slot === '점심') { day.items.push({ slot, placeholder: true, inside: allDaySpot }); return; }
      if (allDaySpot && slot === '오후') { day.items.push({ slot, cont: allDaySpot }); return; }
      const base = day.part !== 'local' && !tripSlots.includes(slot);
      const hit = base ? findLocal(SLOT_KINDS[slot]) : findSpot(day.area, SLOT_KINDS[slot], fullDay && slot === '오전', false);
      if (hit) {
        placed.add(hit.s.id);
        day.items.push({ slot, spot: hit.s, must: opts.mustIds.has(hit.s.id) });
        if (hit.s.k.includes('a') && slot === '오전') allDaySpot = hit.s;
      } else {
        day.items.push({ slot, placeholder: true });
      }
    });
  });
  plan.forEach(day => {
    if (day.part !== 'local') return;
    day.items.forEach((it, j) => {
      if (!it.placeholder || it.inside) return;
      const hit = findSpot(day.area, SLOT_KINDS[it.slot], false, true);
      if (hit) {
        placed.add(hit.s.id);
        day.items[j] = { slot: it.slot, spot: hit.s, must: opts.mustIds.has(hit.s.id) };
      }
    });
  });

  // 4) 아직 못 넣은 '가고 싶은 곳'은 같은(가까운) 지역의 날에 끼워 넣기
  const middleFirst = plan.map((_, i) => i).sort((a, b) => {
    const score = i => (i === 0 || i === days - 1) && days > 2 ? 1 : 0;
    return score(a) - score(b) || a - b;
  });
  const insert = (dayIdx, item, preferSlot) => {
    const day = plan[dayIdx];
    const slots = templates[dayIdx];
    const slot = slots.includes(preferSlot) ? preferSlot
      : slots.find(s => SLOT_KINDS[s].some(k => item.spot && item.spot.k.includes(k))) || slots[slots.length - 1];
    // 하루 종일 일정(테마파크)과 그 이어지는 칸은 지우지 않는다
    const free = it => it.slot === slot && !it.must && !it.custom && !it.cont && !it.inside && !(it.spot && it.spot.k.includes('a'));
    const at = day.items.findIndex(it => free(it) && it.placeholder) >= 0
      ? day.items.findIndex(it => free(it) && it.placeholder) : day.items.findIndex(free);
    if (at >= 0) {
      const removed = day.items[at];
      if (removed.spot) placed.delete(removed.spot.id);
      day.items[at] = { ...item, slot };
    } else {
      day.items.push({ ...item, slot });
    }
    sortItems(day.items);
    return dayIdx;
  };
  const notes = [];
  pool.filter(x => opts.mustIds.has(x.s.id) && !placed.has(x.s.id)).forEach(x => {
    const a = areaOf(x.s.a);
    let dayIdx = plan.findIndex(d => d.area === x.s.a);
    if (dayIdx < 0) {
      dayIdx = middleFirst.slice().sort((p, q) =>
        Math.abs(areaOf(plan[p].area).idx - a.idx) - Math.abs(areaOf(plan[q].area).idx - a.idx))[0];
    }
    const prefer = x.s.k.includes('s') ? '오후' : x.s.k.includes('n') ? '저녁' : '점심';
    insert(dayIdx, { spot: x.s, must: true }, prefer);
    placed.add(x.s.id);
  });

  // 5) 정보가 없는 장소(직접 입력)는 가운데 날부터 오후에 넣기
  //    근교에 가는 날은 피한다 (시내 날이 하나도 없을 때만 근교 날에)
  const customDays = middleFirst.filter(i => plan[i].part === 'local').length ? middleFirst.filter(i => plan[i].part === 'local') : middleFirst;
  opts.customs.forEach((text, i) => {
    const dayIdx = customDays[i % customDays.length];
    const prefer = templates[dayIdx].includes('오후') ? '오후' : '오전';
    insert(dayIdx, { custom: text }, prefer);
    notes.push(`'${text}'${hasBatchim(text) ? '은' : '는'} 위치 정보가 없어 ${dayIdx + 1}일차 ${prefer}에 넣었어요. 지도로 동선을 확인해 보세요.`);
  });

  // 6) 근교 날에 이동·복귀·숙박 칸 넣기 (근교에서 보내는 칸 앞뒤로)
  plan.forEach((day, i) => {
    if (day.part === 'local') return;
    const tripSlots = tripSlotsOf(day, templates[i]);
    const idx = s => SLOT_SORT.indexOf(s);
    const first = Math.min(...tripSlots.map(idx)), last = Math.max(...tripSlots.map(idx));
    if (day.part !== 'nightB') day.items.push({ slot: '이동', travel: 'go', area: day.area, ord: first - 0.5 });
    if (day.part === 'nightA') day.items.push({ slot: '숙박', travel: 'stay', area: day.area, ord: 8 });
    else day.items.push({ slot: '복귀', travel: 'back', area: day.area, ord: last + 0.5 });
    sortItems(day.items);
  });

  // 7) 첫날 맨 앞에 도착, 마지막 날 맨 뒤에 출발(공항·역)
  const gw = GATEWAYS[c.id];
  if (gw) {
    plan[0].items.unshift({ slot: '도착', gate: 'in' });
    plan[plan.length - 1].items.push({ slot: '출발', gate: 'out' });
  }

  return { days: plan, notes, usedIds: new Set(plan.flatMap(d => d.items.filter(it => it.spot).map(it => it.spot.id))) };
}

function searchDest(q) {
  const t = norm(q);
  if (!t) return [];
  const out = new Map();
  const add = (c, reason) => { if (!out.has(c.id)) out.set(c.id, reason); };
  CITIES.forEach(c => {
    if (norm(c.name).includes(t) || c.alias.some(a => norm(a) === t || (t.length >= 2 && norm(a).includes(t)))) add(c, c.country);
  });
  COUNTRY_ORDER.forEach(country => {
    if ([country, ...COUNTRY_ALIAS[country]].some(a => norm(a) === t || (t.length >= 2 && norm(a).includes(t))))
      CITIES.filter(c => c.country === country).forEach(c => add(c, `${country}의 도시`));
  });
  if (t.length >= 2) CITIES.forEach(c => {
    const s = c.spots.find(s => norm(s.name).includes(t));
    if (s) add(c, `'${s.name}'${hasBatchim(s.name) ? '이' : '가'} 있는 도시`);
  });
  if (t.length >= 2) CITIES.forEach(c => {
    const a = c.areas.find(a => a.trip && norm(a.name).includes(t));
    if (a) add(c, `근교에 '${a.name}'${hasBatchim(a.name) ? '이' : '가'} 있는 도시`);
  });
  return [...out].map(([id, reason]) => ({ c: cityById(id), reason }));
}

  clearTimeout(playFlight.land); clearTimeout(playFlight.done);

  const finish = () => { clearTimeout(playFlight.land); clearTimeout(playFlight.done); f.classList.remove('on'); };
  playFlight.land = setTimeout(landCards, quick ? 500 : 2300);
  playFlight.done = setTimeout(finish, quick ? 1000 : 2800);

/* ---------- 근교 도시 ---------- */
// 근교에 쓸 수 있는 날: 첫날(도착)과 마지막 날(출발)은 시내에 두고 나머지
const nearbyCap = () => Math.max(0, state.days - 2);
const nearbyUsed = () => Object.values(state.nearby).reduce((t, v) => t + (v === 'night' ? 2 : 1), 0);
// 그 근교에서 할 거리: 이 달·동행에 맞는 곳만, 동행이 맞는 곳을 앞으로
function tripSpots(c, a) {
  const sc = s => s.p + (s.w.includes(state.who) ? 2 : 0);
  return c.spots.filter(s => s.a === a.id && (!s.m || s.m.includes(state.month)) && !s.no.includes(state.who))
    .sort((x, y) => sc(y) - sc(x));
}
const tripLength = a => a.nb && a.nb.plan === 'half' ? '반나절' : '당일치기';
const dirUrl = (from, to) => `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(from)}&destination=${encodeURIComponent(to)}`;
const plainName = n => n.replace(/\s*\(.*?\)/g, '').trim();
function renderNearby() {
  const c = cityById(state.cityId);
  const box = $('nearbyArea');
  const list = c.areas.filter(a => a.trip && a.nb);
  if (!list.length) { box.innerHTML = ''; return; }
  const cap = nearbyCap(), used = nearbyUsed();
  const whoName = WHO.find(w => w.id === state.who);
  const items = list.map((a, rank) => {
    const nb = a.nb;
    const spots = tripSpots(c, a);
    const length = nb.plan === 'half' ? '반나절 (4~5시간)' : '하루 꼬박';
    const stayTxt = nb.rec === 'night' ? ' · <b>1박 추천</b>' : nb.stay ? ' · 1박도 좋아요' : '';
    const best = nb.best && parseMonths(nb.best[0]).includes(state.month) ? `<span class="badge season">${state.month}월 추천</span>` : '';
    const fit = nb.who && nb.who.includes(state.who) ? `<span class="badge who">${whoName.sub || whoName.label} 추천</span>` : '';
    const cur = state.nearby[a.id] || 'off';
    const extra = v => (v === 'night' ? 2 : v === 'day' ? 1 : 0) - (cur === 'night' ? 2 : cur === 'day' ? 1 : 0);
    const dis = v => v !== cur && used + extra(v) > cap;
    return `<div class="nb-item">
      <div class="nb-name">${a.name}${rank === 0 ? '<span class="badge must">가장 많이 함께 가요</span>' : ''}${fit}${best}</div>
      <div class="nb-facts">
        <div>${nb.icon || '🚆'} 가는 법 · <b>${esc(nb.how)}</b></div>
        <div>⏱ 머무는 시간 · <b>${length}</b>${stayTxt}</div>
        <div>✨ ${esc(nb.what)}${nb.best && best ? ` — ${esc(nb.best[1])}` : ''}</div>
        ${spots.length ? `<div>📍 ${spots.slice(0, 4).map(s => s.name).join(', ')}</div>` : ''}
      </div>
      <div class="seg" role="group" aria-label="${a.name} 일정">
        <button type="button" data-nb="${a.id}" data-plan="off" aria-pressed="${cur === 'off'}">안 가요</button>
        <button type="button" data-nb="${a.id}" data-plan="day" aria-pressed="${cur === 'day'}" ${dis('day') ? 'disabled' : ''}>${nb.plan === 'half' ? '반나절' : '당일'}</button>
        ${nb.stay ? `<button type="button" data-nb="${a.id}" data-plan="night" aria-pressed="${cur === 'night'}" ${dis('night') ? 'disabled' : ''}>1박 2일</button>` : ''}
      </div>
    </div>`;
  }).join('');
  box.innerHTML = `<div class="card nearby">
    <h2>🚆 근교 도시도 가 볼까요?</h2>
    <p class="lead" style="margin-bottom:8px">${c.name} 여행에서 블로그에 자주 함께 나오는 근교예요. 고르면 이동 시간까지 넣어서 루트를 다시 짜요.</p>
    <p class="nb-cap">${cap ? `${dayLabel(state.days)} 중 첫날·마지막 날을 빼고 <b>${cap}일</b>까지 근교에 쓸 수 있어요. (지금 ${used}일)` : `${dayLabel(state.days)}은 일정이 짧아서 근교를 넣기 어려워요. 3일 이상이면 넣을 수 있어요.`}</p>
    ${items}
    <div style="margin-top:14px"><button type="button" class="btn" id="nbBuild" ${used ? '' : 'disabled'}>근교 넣어서 루트 다시 짜기</button></div>
  </div>`;
  box.querySelectorAll('[data-nb]').forEach(b => b.onclick = () => {
    if (b.dataset.plan === 'off') delete state.nearby[b.dataset.nb];
    else state.nearby[b.dataset.nb] = b.dataset.plan;
    renderNearby();
  });
  $('nbBuild').onclick = rebuildWithNearby;
}
function rebuildWithNearby() {
  const c = cityById(state.cityId);
  const r = buildRoute(c, routeOpts(), 'classic');
  const picked = Object.entries(state.nearby).map(([id, v]) => {
    const a = c.areas.find(x => x.id === id);
    return `${a.name}(${v === 'night' ? '1박' : a.nb.plan === 'half' ? '반나절' : '당일'})`;
  });
  const route = {
    kind: 'nearby', title: '근교 포함',
    head: '근교 도시까지 넣은 루트',
    intro: `${picked.join(', ')}을 넣었어요. 가는 길·돌아오는 길과 걸리는 시간까지 일정에 넣었어요.`
      + (state.musts.length ? ' 가고 싶은 곳도 함께 넣었어요.' : ''),
    ...r,
  };
  const at = state.routes.findIndex(x => x.kind === 'nearby');
  if (at >= 0) state.routes[at] = route; else state.routes.push(route);
  state.active = state.routes.indexOf(route);
  renderTabs(); renderRoute(); renderRefs();
  $('tabs').scrollIntoView({ behavior: 'smooth', block: 'start' });

function renderTabs() {
  state.moving = null;
  $('tabs').innerHTML = state.routes.length < 2 ? '' : state.routes.map((r, i) =>
    `<button type="button" class="tab" role="tab" data-tab="${i}" aria-selected="${i === state.active}">${r.title}</button>`).join('');

$('tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  state.active = Number(b.dataset.tab);

function renderRoute() {
  const c = cityById(state.cityId);
  const r = state.routes[state.active];
  const areaName = id => c.areas.find(a => a.id === id).name;
  const whoName = WHO.find(w => w.id === state.who);
  let html = '';
  if (r.intro) html += `<div class="intro-msg">${r.intro}</div>`;
  html += `<div class="route-head"><h2>${r.head}</h2><p>${c.name} · ${dayLabel(state.days)} · 하루 한 지역씩 묶어 이동을 줄였어요.</p></div>`;
  html += r.notes.map(n => `<div class="notice" style="margin-bottom:12px">${esc(n)}</div>`).join('');
  r.days.forEach((day, i) => {
    const areas = [...new Set(day.items.filter(it => it.spot).map(it => it.spot.a))];
    const title = (areas.length ? areas : [day.area]).map(areaName).join(' → ');
    // 근교 장소는 근교 도시 이름을 붙여 검색해야 지도가 맞게 찾는다
    const where = it => {
      const a = it.spot && c.areas.find(x => x.id === it.spot.a);
      return (a && a.trip ? a.name : c.name).replace(/\(.*?\)/g, '').trim();
    };
    const stops = day.items.filter(it => it.spot || it.custom || it.gate)
      .map(it => `${(it.spot ? it.spot.name : it.gate ? GATEWAYS[c.id][0].split('·')[0] : it.custom).replace(/\(.*?\)/g, '').trim()} ${where(it)}`);
    let dir = '';
    if (stops.length >= 2) {
      const q = encodeURIComponent;
      dir = `https://www.google.com/maps/dir/?api=1&origin=${q(stops[0])}&destination=${q(stops[stops.length - 1])}` +
        (stops.length > 2 ? `&waypoints=${stops.slice(1, -1).map(q).join('%7C')}` : '');
    }
    const tripArea = day.part && day.part !== 'local' ? c.areas.find(a => a.id === day.area) : null;
    const sub = !tripArea ? ''
      : day.part === 'nightA' ? `근교 1박 · ${tripArea.name} 첫째 날`
      : day.part === 'nightB' ? `근교 1박 · ${tripArea.name} 둘째 날`
      : `근교 ${tripArea.nb && tripArea.nb.plan === 'half' ? '반나절' : '당일치기'} · ${tripArea.name}`;
    html += `<div class="card day">
      <div class="day-head"><div><div class="d">DAY ${i + 1}${state.days > 1 && i === 0 ? ' · 도착' : ''}${state.days > 1 && i === state.days - 1 ? ' · 출발' : ''}</div><div class="area">${title}</div>${sub ? `<span class="sub">${sub}</span>` : ''}</div>
      ${dir ? `<a href="${dir}" target="_blank" rel="noopener">동선 지도 ↗</a>` : ''}</div>
      <ol class="timeline">${day.items.map((it, j) => renderItem(it, c, whoName, i, j)).join('')}</ol></div>`;
  });
  r.usedIds = new Set(r.days.flatMap(d => d.items.filter(it => it.spot).map(it => it.spot.id)));
  // 시내 볼거리가 모자라 통째로 비는 날이 있으면 근교를 권한다
  const emptyDays = r.days.map((d, i) => (d.part || 'local') === 'local' && !d.items.some(it => it.spot || it.custom) ? i + 1 : 0).filter(Boolean);
  if (emptyDays.length && c.areas.some(a => a.trip && a.nb) && nearbyUsed() < nearbyCap()) {
    html += `<div class="notice" style="margin-bottom:14px">DAY ${emptyDays.join(', ')}에는 시내 일정이 거의 없어요. 아래 <b>근교 도시</b>에서 하루 다녀오는 건 어때요?</div>`;
  }
  html += renderStay(c, r, whoName);
  html += `<div class="row" style="margin-bottom:14px">${r.orig ? '<button type="button" class="btn ghost" id="resetRoute">처음 루트로 되돌리기</button>' : ''}<button type="button" class="btn ghost" id="copyRoute">루트 복사하기</button></div>`;
  $('route').innerHTML = html;
  $('copyRoute').onclick = copyRoute;
  if (r.orig) $('resetRoute').onclick = () => {
    r.days = r.orig; r.orig = null; state.moving = null;
    renderRoute(); toast('처음 루트로 되돌렸어요');
  };
}
// 숙소 동네: 기본 순서 + 동행 일치 + 이번 루트에서 그 근처에 머무는 날 수로 순위를 매겨 3곳까지
function rankStays(c, r) {
  const text = STAYS[c.id];
  if (!text) return [];
  return text.split('\n').map((line, i) => {
    const [name, why, who, areas = ''] = line.split('|');
    const ids = areas.split(',').filter(Boolean);
    const days = state.days > 1 ? r.days.filter(d => ids.includes(d.area)).length : 0;
    const fit = who.includes(state.who);
    return { name, why, fit, days, score: 3 - i * 0.8 + (fit ? 2 : 0) + days };
  }).sort((a, b) => b.score - a.score).slice(0, 3);
}
function renderStay(c, r, whoName) {
  const list = rankStays(c, r);
  if (!list.length) return '';
  const cityName = c.name.replace(/\s*\(.*?\)/, '');
  const enc = encodeURIComponent;
  return `<div class="card stay">
    <h2>🛏️ 숙소는 이 동네 추천</h2>
    ${list.map((s, i) => `<div class="stay-item">
      <div class="spot-name">${i === 0 ? '<span class="badge must">가장 추천</span>' : ''}${s.name}
        ${s.fit ? `<span class="badge who">${whoName.sub || whoName.label} 추천</span>` : ''}
        ${s.days ? `<span class="badge season">루트 ${s.days}일 동선</span>` : ''}</div>
      <div class="spot-desc">${s.why}</div>
      <div class="stay-links">
        <a href="https://www.google.com/maps/search/?api=1&query=${enc(s.name.replace(/\s*\(.*?\)/, '') + ' 호텔 ' + cityName)}" target="_blank" rel="noopener">지도에서 숙소 보기 ↗</a>
        <a href="https://search.naver.com/search.naver?where=blog&query=${enc(cityName + ' ' + s.name.replace(/\s*\(.*?\)/, '') + ' 숙소 추천')}" target="_blank" rel="noopener">블로그 후기 ↗</a>
      </div></div>`).join('')}
    <p class="fine">${state.days === 1 ? '당일치기라 숙소가 필요 없다면 참고만 하세요.'
      : '이번 루트에서 오래 머무는 지역과 동행을 함께 보고 골랐어요.' + (r.days.some(d => c.areas.find(a => a.id === d.area).trip) ? ' 근교 당일치기 날은 숙소를 옮기지 않아도 돼요.' : '')}</p>
  </div>`;
}

const josaRo = w => {
  const ch = w.charCodeAt(w.length - 1);
  if (ch < 0xAC00 || ch > 0xD7A3) return w + '로';
  const jong = (ch - 0xAC00) % 28;
  return w + (jong === 0 || jong === 8 ? '로' : '으로');
};
function renderTravel(it, c) {
  const a = c.areas.find(x => x.id === it.area);
  const nb = a.nb || {};
  const icon = nb.icon || '🚆';
  const home = c.name.replace(/\s*\(.*?\)/, '');
  let title, desc;
  if (it.travel === 'go') { title = `${icon} ${josaRo(a.name)} 이동`; desc = nb.how || ''; }
  else if (it.travel === 'back') { title = `${icon} ${josaRo(home)} 돌아오기`; desc = nb.how || ''; }
  else { title = `🛏️ ${a.name}에서 1박`; desc = nb.stay ? `숙소는 ${nb.stay} 추천` : ''; }
  return `<li class="travel"><span class="slot">${it.slot}</span><div><div class="spot-name">${title}</div><div class="spot-desc">${esc(desc)}</div></div></li>`;
}

function renderItem(it, c, whoName, d, i) {
  if (it.travel) return renderTravel(it, c);
  if (it.gate) {
    const [name, how, train] = GATEWAYS[c.id];
    const desc = it.gate === 'in' ? how
      : train ? '열차 출발 20~30분 전까지 역에 도착하세요.' : `${c.country === '한국' ? '국내선은 1시간' : '국제선은 2~3시간'} 전까지 공항에 도착하세요.`;
    return `<li class="gate"><span class="slot">${it.slot}</span><div><div class="spot-name"><a href="${mapUrl(name.split('·')[0], c)}" target="_blank" rel="noopener">${train ? '🚄' : '✈️'} ${name}</a></div><div class="spot-desc">${desc}</div></div></li>`;
  }
  if (it.cont) {
    return `<li class="placeholder"><span class="slot">${it.slot}</span><div><div class="spot-name">${it.cont.name} 계속</div><div class="spot-desc">하루 종일 즐기는 곳이라 오후까지 비워 뒀어요.</div></div></li>`;
  }
  if (it.placeholder) {
    const t = it.inside ? '파크 안에서 점심' : it.slot === '점심' ? '근처 맛집에서 점심' : it.slot === '저녁' ? '숙소 근처에서 저녁·휴식' : '자유 시간 (카페·쇼핑)';
    return `<li class="placeholder"><span class="slot">${it.slot}</span><div><div class="spot-name">${t}</div></div></li>`;
  }
  const moved = it.moved ? '<span class="badge moved">옮김</span>' : '';
  const tools = moveTools(d, i);
  if (it.custom) {
    return `<li><span class="slot">${it.slot}</span><div><div class="spot-name"><a href="${mapUrl(it.custom, c)}" target="_blank" rel="noopener">${esc(it.custom)}</a><span class="badge custom">직접 추가</span>${moved}${tools.btn}</div><div class="spot-desc">내가 가고 싶은 곳 · <a href="${dirUrl(plainName(c.name) + ' ' + c.country, it.custom)}" target="_blank" rel="noopener">가는 길·거리 ↗</a> · <a href="https://search.naver.com/search.naver?where=blog&query=${encodeURIComponent(it.custom + ' 가볼만한 곳')}" target="_blank" rel="noopener">주변 가볼 만한 곳 ↗</a></div>${tools.panel}</div></li>`;
  }
  const s = it.spot;
  const badges = [];
  if (it.must) badges.push('<span class="badge must">가고 싶은 곳</span>');
  if (s.m) badges.push('<span class="badge season">이 달 추천</span>');
  if (!it.must && s.w.includes(state.who)) badges.push(`<span class="badge who">${whoName.sub || whoName.label} 추천</span>`);
  const sa = c.areas.find(x => x.id === s.a);
  return `<li><span class="slot">${it.slot}</span><div><div class="spot-name"><a href="${mapUrl(s.name, sa && sa.trip ? sa : c)}" target="_blank" rel="noopener">${s.name}</a>${badges.join('')}${moved}${tools.btn}</div><div class="spot-desc">${s.desc}</div>${tools.panel}</div></li>`;
}

/* ---------- 일정 옮기기·빼기 ---------- */
// 칸 순서. 이동·복귀·숙박 칸은 만들 때 정한 ord(앞뒤 칸 사이 값)로 자리를 지킨다
const SLOT_SORT = ['도착', '오전', '점심', '오후', '저녁'];
const slotRank = it => it.ord !== undefined ? it.ord : it.slot === '출발' ? 9 : SLOT_SORT.indexOf(it.slot);
const sortItems = items => items.sort((a, b) => slotRank(a) - slotRank(b));
const isAllDay = (day, it) => it.spot && it.spot.k.includes('a') && day.items.some(x => x.cont === it.spot);
const isFullDay = day => ['오전', '점심', '오후'].every(s => day.items.some(x => x.slot === s));
// 하루를 통째로 쓰는 일정: 테마파크(종류 a)와 근교 당일치기 날의 근교 장소
const isPark = it => !!(it.spot && it.spot.k.includes('a'));
const isTripSpot = (day, it) => !!(day.part === 'day' && it.spot && it.spot.a === day.area);
const daySlots = day => SLOT_ORDER.filter(s => day.items.some(x => x.slot === s)).join();
const moveKind = (day, it) => isTripSpot(day, it) ? 'trip' : isPark(it) ? 'park' : 'one';

// 옮길 수 있는 날: 테마파크는 오전·점심·오후가 모두 있는 날로만,
// 근교 당일치기는 하루를 통째로 맞바꾸므로 칸 구성이 같은 날(근교 1박 날 제외)로만
function moveTargets(r, d, i) {
  const from = r.days[d], kind = moveKind(from, from.items[i]);
  return r.days.map((_, j) => j).filter(j => {
    if (j === d) return false;
    const to = r.days[j];
    if (kind === 'trip') return daySlots(to) === daySlots(from) && (to.part || 'local') !== 'nightA' && to.part !== 'nightB';
    if (kind === 'park') return isFullDay(to) && (to.part || 'local') === 'local';
    return true;
  });
}
function moveTools(d, i) {
  const btn = `<button type="button" class="move-btn" data-move="${d}:${i}" aria-expanded="${!!(state.moving && state.moving.d === d && state.moving.i === i)}">옮기기</button>`;
  if (!state.moving || state.moving.d !== d || state.moving.i !== i) return { btn, panel: '' };
  const r = state.routes[state.active];
  const targets = moveTargets(r, d, i);
  const kind = moveKind(r.days[d], r.days[d].items[i]);
  const hint = kind === 'trip' ? ' <small>(근교에 다녀오는 날이라 그날 일정 전체를 서로 바꿔요)</small>'
    : kind === 'park' ? ' <small>(하루 종일 일정이라 그날 낮 일정을 이 일정으로 바꾸고, 원래 일정은 지금 날로 옮겨요)</small>' : '';
  return {
    btn,
    panel: `<div class="move-panel">
      <div class="move-q">${targets.length ? '몇 일차로 옮길까요?' : '옮길 수 있는 날이 없어요.'}${hint}</div>
      <div class="chips small">${targets.map(j => `<button type="button" class="chip" data-to="${j}">DAY ${j + 1}</button>`).join('')}</div>
      <div class="move-actions"><button type="button" class="link-btn" data-remove>일정에서 빼기</button><button type="button" class="link-btn" data-cancel>취소</button></div>
    </div>`,
  };
}
function snapshot(days) {
  return days.map(d => ({ ...d, items: d.items.map(it => ({ ...it })) }));
}
function moveItem(r, d, i, j) {
  if (!r.orig) r.orig = snapshot(r.days);
  const from = r.days[d], to = r.days[j];
  const it = from.items[i];
  const mark = x => ({ ...x, moved: x.spot || x.custom ? true : x.moved });
  const kind = moveKind(from, it);
  if (kind === 'trip') {
    // 근교 당일치기는 이동·복귀 칸까지 그날 일정 전체를 맞바꾼다 (공항·역 도착/출발 칸은 그 날에 남긴다)
    const body = day => day.items.filter(x => !x.gate).map(mark);
    const fromBody = body(from), toBody = body(to);
    from.items = sortItems(from.items.filter(x => x.gate).concat(toBody));
    to.items = sortItems(to.items.filter(x => x.gate).concat(fromBody));
    [from.area, to.area] = [to.area, from.area];
    [from.part, to.part] = [to.part, from.part];
    return;
  }
  const part = x => ['오전', '점심', '오후'].includes(x.slot);
  if (kind === 'park') {
    if (to.items.some(x => part(x) && isPark(x))) {
      // 옮길 날에도 테마파크가 있으면 두 날의 낮 일정을 그대로 맞바꾼다
      const mine = from.items.filter(part), theirs = to.items.filter(part);
      from.items = sortItems(from.items.filter(x => !part(x)).concat(theirs.map(mark)));
      to.items = sortItems(to.items.filter(x => !part(x)).concat(mine.map(x => x === it ? mark(x) : x)));
      return;
    }
    // 원래 날에서 파크와 이어지는 칸을 비우고, 옮길 날의 오전·점심·오후는 파크 하루로 바꾼다.
    // 옮길 날에 원래 있던 일정은 지워지지 않게 원래 날의 빈칸으로 옮긴다.
    from.items = from.items.map(x => x === it || x.cont === it.spot || x.inside === it.spot ? { slot: x.slot, placeholder: true } : x);
    const displaced = to.items.filter(x => part(x) && (x.spot || x.custom));
    to.items = sortItems(to.items.filter(x => !part(x)).concat([
      { ...it, slot: '오전', moved: true },
      { slot: '점심', placeholder: true, inside: it.spot },
      { slot: '오후', cont: it.spot },
    ]));
    displaced.forEach(x => placeInto(from, x));
    return;
  }
  from.items[i] = { slot: it.slot, placeholder: true };
  placeInto(to, it);
}
// 옮길 날의 칸: 같은 시간대 → 장소 종류에 맞는 시간대 → 아무 칸. 빈칸이면 채우고 아니면 하나 더 넣는다
function placeInto(to, it) {
  const slots = SLOT_ORDER.filter(s => to.items.some(x => x.slot === s));
  const kinds = it.spot ? it.spot.k : 's';
  const slot = slots.includes(it.slot) ? it.slot
    : slots.find(s => SLOT_KINDS[s].some(k => kinds.includes(k))) || slots[slots.length - 1] || it.slot;
  const empty = to.items.findIndex(x => x.slot === slot && x.placeholder && !x.inside);
  const item = { ...it, slot, moved: true };
  if (empty >= 0) to.items[empty] = item;
  else { to.items.push(item); sortItems(to.items); }
}
function removeItem(r, d, i) {
  if (!r.orig) r.orig = snapshot(r.days);
  const day = r.days[d];
  const it = day.items[i];
  if (isAllDay(day, it)) day.items = day.items.map(x => x.cont === it.spot || x.inside === it.spot ? { slot: x.slot, placeholder: true } : x);
  day.items[day.items.indexOf(it)] = { slot: it.slot, placeholder: true };
}
$('route').addEventListener('click', e => {
  const r = state.routes[state.active];
  const mv = e.target.closest('[data-move]');
  if (mv) {
    const [d, i] = mv.dataset.move.split(':').map(Number);
    state.moving = state.moving && state.moving.d === d && state.moving.i === i ? null : { d, i };
    renderRoute();
    return;
  }
  if (!state.moving) return;
  const { d, i } = state.moving;
  const to = e.target.closest('[data-to]');
  if (to) {
    const j = Number(to.dataset.to);
    const name = r.days[d].items[i].spot ? r.days[d].items[i].spot.name : r.days[d].items[i].custom;
    const kind = moveKind(r.days[d], r.days[d].items[i]);
    moveItem(r, d, i, j);
    state.moving = null;
    renderRoute();
    toast(kind === 'trip' ? `DAY ${d + 1} ↔ DAY ${j + 1} 일정을 통째로 바꿨어요`
      : kind === 'park' ? `${name} → DAY ${j + 1}, 그날 일정은 DAY ${d + 1}로 옮겼어요` : `${name} → DAY ${j + 1}로 옮겼어요`);
  } else if (e.target.closest('[data-remove]')) {
    removeItem(r, d, i);
    state.moving = null;
    renderRoute();
    toast('일정에서 뺐어요');
  } else if (e.target.closest('[data-cancel]')) {
    state.moving = null;
    renderRoute();
  }
});

function copyRoute() {
  const c = cityById(state.cityId);
  const r = state.routes[state.active];
  const lines = [`[${c.name} ${dayLabel(state.days)} · ${state.month}월 · ${whoLabel(state.who)}] ${r.head}`];
  r.days.forEach((d, i) => {
    lines.push('', `DAY ${i + 1}`);
    d.items.forEach(it => {
      if (it.travel) {
        const a = c.areas.find(x => x.id === it.area);
        const how = a.nb && a.nb.how ? ` (${a.nb.how})` : '';
        lines.push(`- ${it.slot}: ${it.travel === 'go' ? josaRo(a.name) + ' 이동' + how : it.travel === 'back' ? josaRo(c.name) + ' 돌아오기' + how : a.name + '에서 1박'}`);
        return;
      }
      lines.push(`- ${it.slot}: ${it.spot ? it.spot.name : it.gate ? GATEWAYS[c.id][0] : it.custom || (it.cont ? it.cont.name + ' 계속' : '자유 시간')}`);
    });
  });
  const text = lines.join('\n');
  const done = () => toast('루트를 복사했어요');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('복사하지 못했어요'); }
  ta.remove();
}

/* ---------- 가고 싶은 여행지가 있나요? ---------- */
function renderAsk() {
  const c = cityById(state.cityId);
  const box = $('askArea');
  if (state.answered === null) {
    box.innerHTML = `<div class="card ask">
      <h2>가고 싶은 여행지가 있나요?</h2>
      <p class="lead" style="margin-bottom:14px">꼭 넣고 싶은 곳이 있으면 그곳을 포함해서 루트를 다시 짜 드릴게요.</p>
      <div class="row"><button type="button" class="btn" id="askYes">예</button><button type="button" class="btn ghost" id="askNo">아니오</button></div></div>`;
    $('askYes').onclick = () => { state.answered = 'yes'; renderAsk(); $('mustText').focus(); };
    $('askNo').onclick = answerNo;
    return;
  }
  if (state.answered === 'yes') {
    const used = state.routes[state.active].usedIds;
    const sugg = c.spots.filter(s => !used.has(s.id) && !state.musts.some(m => m.spotId === s.id)).slice(0, 10);
    const r = state.routes[state.active];
    const tripSugg = c.areas.filter(a => a.trip && !r.days.some(d => d.area === a.id) && !state.musts.some(m => m.areaId === a.id) && tripSpots(c, a).length);
    box.innerHTML = `<div class="card ask">
      <h2>어디에 가고 싶나요?</h2>
      <p class="lead" style="margin-bottom:6px">장소 이름을 직접 입력하세요. 여러 곳을 넣어도 돼요. 근교 도시 이름을 넣으면 가는 길과 그 도시의 가볼 만한 곳까지 함께 넣어요.</p>
      <form class="must-input" id="mustForm"><input id="mustText" placeholder="예: ${esc(sugg[0] ? plainName(sugg[0].name) : '가고 싶은 장소')}${tripSugg[0] ? `, ${esc(plainName(tripSugg[0].name))}` : ''}" autocomplete="off"><button type="submit">추가</button></form>
      <div class="picked" id="picked">${state.musts.map((m, i) => `<span>${esc(m.text)}${m.areaId ? ' (근교)' : ''}<button type="button" data-rm="${i}" aria-label="${esc(m.text)} 빼기">×</button></span>`).join('')}</div>
      ${mustInfo(c)}
      ${tripSugg.length ? `<div class="suggest-label">근교 도시도 함께 가 볼까요?</div><div class="chips small">${tripSugg.map(a => `<button type="button" class="chip" data-trip="${a.id}">+ ${a.name}</button>`).join('')}</div>` : ''}
      ${sugg.length ? `<div class="suggest-label">이번 루트에 없는 ${c.name} 명소</div><div class="chips small" id="sugg">${sugg.map(s => `<button type="button" class="chip" data-add="${s.id}">+ ${s.name}</button>`).join('')}</div>` : ''}
      <div style="margin-top:16px"><button type="button" class="btn coral" id="rebuild" ${state.musts.length ? '' : 'disabled'}>이 장소를 넣어서 루트 다시 짜기</button></div>
      <div style="text-align:center"><button type="button" class="link-btn" id="toNo">가고 싶은 곳은 없어요 · 다른 루트 보기</button></div></div>`;
    $('mustForm').onsubmit = e => {
      e.preventDefault();
      const text = $('mustText').value.trim();
      if (!text) return;
      addMust(text);
    };
    box.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
      const s = c.spots.find(x => x.id === b.dataset.add);
      state.musts.push({ text: s.name, spotId: s.id });
      renderAsk();
    });
    box.querySelectorAll('[data-trip]').forEach(b => b.onclick = () => addTripMust(c, c.areas.find(a => a.id === b.dataset.trip)));
    box.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { state.musts.splice(Number(b.dataset.rm), 1); renderAsk(); });
    $('rebuild').onclick = rebuildWithMusts;
    $('toNo').onclick = answerNo;
    return;
  }
  // 'no' 또는 다시 짠 뒤
  box.innerHTML = `<div class="card">
    <div class="row"><button type="button" class="btn ghost" id="moreYes">가고 싶은 곳 넣기</button>${state.routes.some(r => r.kind === 'alt') ? '' : '<button type="button" class="btn ghost" id="moreNo">다른 루트 보기</button>'}</div></div>`;
  $('moreYes').onclick = () => { state.answered = 'yes'; renderAsk(); $('mustText').focus(); };
  if ($('moreNo')) $('moreNo').onclick = answerNo;
}

// 이름 조각이 이런 흔한 말뿐이면 같은 곳으로 보지 않는다 ('스미요시 신사'가 '후시미 이나리 신사'로 바뀌지 않도록)
const GENERIC_WORDS = new Set(['신사', '공원', '시장', '야시장', '거리', '골목', '사원', '사찰', '해변', '비치', '해수욕장', '타워', '전망대',
  '박물관', '미술관', '수족관', '동물원', '섬', '역', '다리', '호수', '카페', '성당', '궁', '투어', '쇼핑', '센터', '광장', '마을', '산', '폭포', '야경', '맛집']);
function matchSpot(c, text) {
  const t = norm(text);
  if (t.length < 2) return null;
  let best = null, bestLen = 0;
  c.spots.forEach(s => {
    const full = norm(s.name);
    const parts = s.name.split(/[·()\s,]+/).map(norm).filter(p => p.length >= 2 && !GENERIC_WORDS.has(p));
    let len = 0;
    if (full === t) len = 999;
    else if (full.includes(t) || t.includes(full)) len = Math.min(full.length, t.length);
    else parts.forEach(p => { if (p.includes(t) || t.includes(p)) len = Math.max(len, Math.min(p.length, t.length)); });
    if (len > bestLen) { bestLen = len; best = s; }
  });
  return bestLen >= 2 ? best : null;
}
// 근교 도시 이름(예: 교토, 가마쿠라, 속초)을 넣었는지. '수원시', '교토 여행'처럼 붙여 써도 찾는다
function matchTripArea(c, text) {
  const t = norm(text).replace(/(당일치기|여행|시)$/, '');
  if (t.length < 2) return null;
  return c.areas.find(a => a.trip &&
    [a.name, ...a.name.split(/[·()\s,]+/)].map(norm).some(p => p.length >= 2 && p === t)) || null;
}
function addTripMust(c, a) {
  if (state.musts.some(m => m.areaId === a.id)) { toast('이미 넣은 곳이에요'); return; }
  state.musts.push({ text: a.name, areaId: a.id });
  toast(`${josa(plainName(a.name), '은', '는')} 근교라 가는 길과 가볼 만한 곳까지 함께 넣을게요`);
  renderAsk();
}
// 고른 곳 중 근교에 있는 곳은 가는 법·같이 넣을 곳을, 정보가 없는 곳은 거리·볼거리를 찾아볼 링크를 보여 준다
function mustInfo(c) {
  const home = plainName(c.name);
  const areas = [];
  state.musts.forEach(m => {
    const id = m.areaId || (m.spotId && c.spots.find(s => s.id === m.spotId).a);
    const a = id && c.areas.find(x => x.id === id);
    if (a && a.trip && !areas.includes(a)) areas.push(a);
  });
  const trips = areas.map(a => {
    const nb = a.nb || {};
    const spots = tripSpots(c, a).slice(0, 4);
    return `<div class="trip-box">
      <div class="nb-name">${nb.icon || '🚆'} ${a.name}<span class="badge who">근교 ${tripLength(a)}</span></div>
      <div class="nb-facts">
        <div>가는 법 · <b>${esc(nb.how || `${home}에서 하루 다녀올 수 있는 거리`)}</b> <a href="${dirUrl(home + ' ' + c.country, plainName(a.name) + ' ' + c.country)}" target="_blank" rel="noopener">지도로 거리 보기 ↗</a></div>
        ${nb.what ? `<div>✨ ${esc(nb.what)}</div>` : ''}
        ${spots.length ? `<div>📍 가볼 만한 곳 · <b>${spots.map(s => s.name).join(', ')}</b></div>` : ''}
      </div></div>`;
  });
  const customs = state.musts.filter(m => !m.spotId && !m.areaId).map(m => `<div class="trip-box">
      <div class="nb-name">📍 ${esc(m.text)}<span class="badge custom">직접 추가</span></div>
      <div class="nb-facts">
        <div>정보가 없는 곳이라 거리와 주변 볼거리는 링크로 확인해 주세요.</div>
        <div><a href="${dirUrl(home + ' ' + c.country, m.text)}" target="_blank" rel="noopener">${home}에서 가는 길·거리 ↗</a> · <a href="https://search.naver.com/search.naver?where=blog&query=${encodeURIComponent(m.text + ' 가볼만한 곳')}" target="_blank" rel="noopener">${esc(m.text)} 가볼 만한 곳 ↗</a></div>
      </div></div>`);
  const tripDays = state.musts.filter(m => m.areaId).length + nearbyUsed();
  const warn = areas.length && tripDays > nearbyCap()
    ? `<div class="notice" style="margin-bottom:10px">${dayLabel(state.days)} 일정에 근교를 넣으면 ${c.name} 시내 일정이 많이 줄어요.</div>` : '';
  return warn + trips.join('') + customs.join('');
}
function addMust(text) {
  const c = cityById(state.cityId);
  const a = matchTripArea(c, text);
  if (a) { addTripMust(c, a); $('mustText').focus(); return; }
  const s = matchSpot(c, text);
  if (s) {
    if (state.musts.some(m => m.spotId === s.id)) { toast('이미 넣은 곳이에요'); return; }
    state.musts.push({ text: s.name, spotId: s.id });
    if (norm(s.name) !== norm(text)) toast(`'${s.name}'(으)로 찾았어요`);
  } else {
    if (state.musts.some(m => norm(m.text) === norm(text))) { toast('이미 넣은 곳이에요'); return; }
    state.musts.push({ text, spotId: null });
  }
  renderAsk();
  $('mustText').focus();
}
function rebuildWithMusts() {
  const c = cityById(state.cityId);
  const base = state.routes[state.active].kind === 'alt' ? 'alt' : 'classic';
  const classic = state.routes.find(r => r.kind === 'classic');
  const r = buildRoute(c, routeOpts(), base, base === 'alt' ? classic.usedIds : new Set());
  const names = state.musts.map(m => m.text);
  // 근교에 있는 곳을 골랐으면 몇 일차에, 어떻게 가서, 무엇을 함께 넣었는지 알려 준다
  const home = plainName(c.name);
  const tripIds = [...new Set(state.musts.map(m => m.areaId || (m.spotId && c.spots.find(s => s.id === m.spotId).a)))]
    .filter(id => id && c.areas.find(a => a.id === id).trip);
  tripIds.reverse().forEach(id => {
    const a = c.areas.find(x => x.id === id);
    const di = r.days.map((d, i) => d.area === id ? i : -1).filter(i => i >= 0);
    if (!di.length) return;
    const len = r.days[di[0]].part === 'nightA' ? '1박 2일' : tripLength(a);
    const spots = di.flatMap(i => r.days[i].items.filter(it => it.spot && it.spot.a === id).map(it => it.spot.name));
    const how = a.nb && a.nb.how ? `${home}에서 ${a.nb.how}` : `${home}에서 가까운 근교`;
    r.notes.unshift(`${a.name}(${how}) — DAY ${di.map(i => i + 1).join('~')}에 ${len}로 넣었어요. 가는 길·돌아오는 길${spots.length ? `과 함께 ${spots.join(', ')}도 넣었어요.` : '도 함께 넣었어요.'}`);
  });
  const route = {
    kind: 'must', title: '가고 싶은 곳 포함',
    head: '가고 싶은 곳을 넣어 다시 짠 루트',
    intro: `${names.map(n => `'${esc(n)}'`).join(', ')}${hasBatchim(names[names.length - 1]) ? '을' : '를'} 넣어서 루트를 다시 짰어요.`,
    ...r,
  };
  const at = state.routes.findIndex(x => x.kind === 'must');
  if (at >= 0) state.routes[at] = route; else state.routes.push(route);
  state.active = state.routes.indexOf(route);
  state.answered = 'done';
  renderTabs(); renderRoute(); renderAsk(); renderRefs();
  $('tabs').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function answerNo() {
  const c = cityById(state.cityId);
  state.answered = 'no';
  let at = state.routes.findIndex(r => r.kind === 'alt');
  if (at < 0) {
    const classic = state.routes.find(r => r.kind === 'classic');
    const opts = { ...routeOpts(), mustIds: new Set(), mustAreas: [], customs: [], nearby: {} };
    const r = buildRoute(c, opts, 'alt', classic.usedIds);
    state.routes.push({
      kind: 'alt', title: '다른 루트',
      head: '근교·숨은 명소를 넣은 다른 루트',
      intro: '이 전에 추천한 루트 말고 다른 것도 있어요! 대표 명소는 줄이고 근교 여행지와 현지인이 좋아하는 곳을 더 넣었어요.',
      ...r,
    });
    at = state.routes.length - 1;
  }
  state.active = at;
  renderTabs(); renderRoute(); renderAsk(); renderRefs();
  $('tabs').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ---------- 참고 링크 ---------- */
function renderRefs() {
  const c = cityById(state.cityId);
  const cityName = c.name.replace(/\s*\(.*?\)/, '');
  const whoWord = { k: '아이와', p: '부모님과', r: '친구와', c: '커플', s: '혼자' }[state.who];
  const q = `${cityName} ${dayLabel(state.days)} ${whoWord} 여행 코스`;
  const enc = encodeURIComponent;
  $('refs').innerHTML = `
    <h2>블로그·여행 사이트에서 더 보기</h2>
    <a href="https://search.naver.com/search.naver?where=blog&query=${enc(q)}" target="_blank" rel="noopener">네이버 블로그 후기 <span>${esc(q)} ↗</span></a>
    <a href="https://www.google.com/search?q=${enc(q)}" target="_blank" rel="noopener">구글 검색 <span>여행 코스 글 모아보기 ↗</span></a>
    <a href="https://www.tripadvisor.co.kr/Search?q=${enc(cityName)}" target="_blank" rel="noopener">트립어드바이저 <span>${esc(cityName)} 명소 순위·리뷰 ↗</span></a>
    <a href="https://www.youtube.com/results?search_query=${enc(cityName + ' ' + state.month + '월 여행 브이로그')}" target="_blank" rel="noopener">유튜브 <span>${state.month}월 ${esc(cityName)} 브이로그 ↗</span></a>
    <p class="fine">추천 루트는 블로그·여행 사이트에서 자주 소개되는 코스를 정리한 예시예요. 영업시간·휴무일·예약 여부는 가기 전에 꼭 확인하세요.</p>`;
}

renderPlan();
</script>
