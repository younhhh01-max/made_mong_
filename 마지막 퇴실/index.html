<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>마지막 퇴실 기록</title>
<style>
:root{
  --bg:#0b0c0d; --panel:#131517; --panel2:#1a1c1e; --line:#2b3033; --line2:#3a4246;
  --text:#cfe3d0; --dim:#8e9b93; --faint:#5d6862; --warn:#b33a3a; --crt:#7fd18a;
  --amber:#d6b26a; --paper:#d9d0b4; --ink:#2b2720; --vig:.6;
  --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --mono:"D2Coding","Consolas","Menlo","Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
#bgRain{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.28;pointer-events:none}
#vignette{position:fixed;inset:0;z-index:5;pointer-events:none;
  background:radial-gradient(ellipse at center, rgba(0,0,0,0) 35%, rgba(0,0,0,var(--vig)) 100%);transition:background 2s}
#flash{position:fixed;inset:0;z-index:6;pointer-events:none;background:#c9d6e6;opacity:0}
#app{position:relative;z-index:2;max-width:1200px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:10px 12px 12px;gap:10px}
#app.flick{animation:flick .9s steps(1) 1}
@keyframes flick{0%{filter:brightness(1)}10%{filter:brightness(.45)}18%{filter:brightness(1.05)}30%{filter:brightness(.6)}38%{filter:brightness(1)}62%{filter:brightness(.75)}70%{filter:brightness(1)}}
#app.flick-soft{animation:flicks .5s steps(1) 1}
@keyframes flicks{0%{filter:brightness(1)}30%{filter:brightness(.82)}50%{filter:brightness(1)}}

/* top bar */
#top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  background:rgba(19,21,23,.92);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
#chapTitle{font-weight:700;letter-spacing:.02em}
#clock{font-family:var(--mono);color:var(--dim);font-size:.9rem}
#timeLabel{color:var(--crt);margin-left:6px}
.tb-right{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-family:var(--mono);font-size:.85rem;color:var(--amber);border:1px solid #4a4130;border-radius:99px;padding:3px 10px;background:#1b1912}
.tbtn{min-height:40px;min-width:44px;padding:6px 12px;background:var(--panel2);border:1px solid var(--line2);border-radius:5px;font-size:.92rem}
.tbtn:hover,.tbtn:focus-visible{border-color:var(--text);outline:none;background:#22262a}
.tbtn.danger{border-color:#5a2a2a;color:#e3b0b0}
.tbtn.danger:hover{border-color:var(--warn)}

/* main */
#main{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;overflow:auto}
#main.locked-ui #objects button,#main.locked-ui #locBar button,#main.locked-ui #proceed{pointer-events:none;opacity:.5}
#viewWrap{position:relative;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px;
  background:rgba(19,21,23,.94);border:1px solid var(--line);border-radius:6px;padding:12px}
#locHead{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
#locFloor{font-family:var(--mono);font-size:.8rem;color:#0b0c0d;background:var(--dim);padding:0 6px;border-radius:3px}
#locName{margin:0;font-size:1.15rem}
#artBox{position:relative;width:100%;aspect-ratio:16/9;max-width:calc(48vh * 16 / 9);margin:0 auto;align-self:start;border-radius:4px;overflow:hidden;border:1px solid #23282b;background:#0a0c0d}
#art{position:absolute;inset:0}
.photo{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat}
.rainwin{position:absolute;overflow:hidden;pointer-events:none}
.rainwin canvas{position:absolute;inset:0;width:100%;height:100%}
.cover{position:absolute;pointer-events:none}
.overlay-canvas{position:absolute;inset:0;width:100%;height:100%}
.tubelight{position:absolute;pointer-events:none;background:radial-gradient(ellipse at top, rgba(200,225,235,.10), rgba(200,225,235,0) 70%);animation:tube 9s infinite}
@keyframes tube{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.2}49%{opacity:1}50%{opacity:.4}51%{opacity:1}}
.screenglow{position:absolute;pointer-events:none;background:radial-gradient(ellipse, rgba(127,209,138,.14), rgba(127,209,138,0) 70%);animation:pulse 4s infinite}
#side{display:flex;flex-direction:column;gap:10px;min-width:0}
#locDesc{margin:0;color:var(--dim);font-size:.95rem}
#objects{display:flex;flex-direction:column;gap:6px}
.obj{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:46px;text-align:left;
  background:#16191b;border:1px solid var(--line2);border-radius:5px;padding:8px 12px}
.obj:hover,.obj:focus-visible{border-color:var(--text);background:#1d2124;outline:none}
.obj .nm{flex:1}
.obj .bd{font-family:var(--mono);font-size:.75rem;padding:2px 7px;border-radius:3px;white-space:nowrap;border:1px solid}
.obj.todo .bd{color:var(--text);border-color:var(--line2)}
.obj.new{border-color:#7a6a3e}
.obj.new .bd{color:#111;background:var(--amber);border-color:var(--amber);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.55}}
.obj.done{opacity:.62;background:#121416}
.obj.done .bd{color:var(--faint);border-color:#2b3033}
.obj.flavor .bd{color:var(--dim);border-style:dashed}
#proceedWrap{margin-top:auto;border-top:1px dashed var(--line);padding-top:10px}
#proceed{width:100%;min-height:48px;background:#1d2a20;border:1px solid #3d6447;border-radius:5px;color:var(--crt);font-weight:700}
#proceed:hover:not(:disabled){background:#24382a;border-color:var(--crt)}
#proceed:disabled{background:#16191b;border-color:var(--line);color:var(--faint);cursor:not-allowed}
#proceedNote{margin:6px 0 0;font-size:.85rem;color:var(--faint)}
#locBar{display:flex;gap:6px;flex-wrap:wrap}
.loc{flex:1;min-width:120px;min-height:46px;background:rgba(22,25,27,.95);border:1px solid var(--line2);border-radius:5px;padding:6px 10px}
.loc small{display:block;font-family:var(--mono);font-size:.7rem;color:var(--faint)}
.loc:hover,.loc:focus-visible{border-color:var(--text);outline:none}
.loc.here{border-color:var(--crt);box-shadow:inset 0 -3px 0 var(--crt)}
.loc.lockd{color:var(--faint);border-style:dashed}

/* dialog */
#dialog{position:relative;min-height:150px;background:rgba(14,16,17,.97);border:1px solid var(--line2);border-radius:6px;padding:14px 18px 16px;cursor:pointer;outline:none}
#dialog.explore{cursor:default}
#dlgName{display:inline-block;min-height:1.4em;font-weight:700;font-size:.9rem;padding:0 8px;border-radius:3px;margin-bottom:4px}
#dlgName:empty{padding:0}
.sp-me{background:#2a3330;color:#d9efe0}
.sp-kang{background:#3a2422;color:#f0c7bf}
.sp-sys{background:#13261a;color:var(--crt);font-family:var(--mono)}
.sp-det{background:#1f2836;color:#c8d6ee}
#dlgText{white-space:pre-wrap;font-size:1.05rem;min-height:3.2em}
#dlgText.t-n{color:#b9c7be}
#dlgText.t-sys{font-family:var(--mono);color:var(--crt);text-shadow:0 0 6px rgba(127,209,138,.35)}
#dlgText.t-kang{color:#ecd9d4}
#dlgText.glitch{color:#e07a7a;text-shadow:2px 0 #b33a3a,-2px 0 #3a7ab3}
#dlgText.hint{color:var(--dim);font-size:.95rem}
#dlgNext{position:absolute;right:16px;bottom:8px;font-size:.8rem;color:var(--faint);animation:pulse 1.4s infinite}
#dlgChoices{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.choice{text-align:left;min-height:44px;background:#181c1e;border:1px solid var(--line2);border-radius:5px;padding:8px 12px}
.choice:hover,.choice:focus-visible{border-color:var(--text);background:#20262a;outline:none}
.choice.asked{color:var(--dim)}
.choice.asked::after{content:"  · 이미 물어봄";font-size:.8rem;color:var(--faint)}
.choice.key{border-color:#6b5a32;color:var(--amber)}

/* art: shared */
.win{position:absolute;overflow:hidden;background:#06090b;border:6px solid #2a2e30;box-shadow:inset 0 0 30px #000,0 0 0 1px #000}
.win canvas{position:absolute;inset:0;width:100%;height:100%}
.mull{position:absolute;background:#2a2e30;box-shadow:0 0 4px #000}
.glare{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.05) 0%,rgba(255,255,255,0) 35%,rgba(255,255,255,.03) 60%,rgba(255,255,255,0) 70%)}
.wall{position:absolute;inset:0;background:linear-gradient(#1b1f1f,#121515 60%,#0c0e0e)}
.floor{position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(#161818,#0b0c0c);border-top:1px solid #222}
.lampcone{position:absolute;pointer-events:none;background:radial-gradient(ellipse at top, rgba(205,228,210,.16), rgba(205,228,210,0) 70%)}
/* security */
.art-security .win{left:7%;top:10%;width:46%;height:52%}
.art-security .desk{position:absolute;left:0;right:0;bottom:12%;height:16%;background:linear-gradient(#262a2a,#171919);border-top:2px solid #333}
.art-security .monitor{position:absolute;left:60%;bottom:28%;width:18%;height:24%;background:#0d1410;border:5px solid #222;border-radius:3px;box-shadow:0 0 30px rgba(127,209,138,.18)}
.art-security .monitor::after{content:"";position:absolute;inset:6px;background:repeating-linear-gradient(#123018 0 2px,#0d1a10 2px 4px);opacity:.8}
.art-security .printer{position:absolute;right:4%;bottom:28%;width:15%;height:15%;background:linear-gradient(#3a3d3c,#262827);border-radius:3px 3px 1px 1px}
.art-security .printer::before{content:"";position:absolute;left:12%;right:12%;top:-6px;height:6px;background:#e8e2d0;opacity:.8}
.led{position:absolute;right:8px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--crt);box-shadow:0 0 6px var(--crt);animation:pulse 2.4s infinite}
.art-security .keybox{position:absolute;right:6%;top:12%;width:12%;height:26%;background:#2b2f2e;border:2px solid #3a3f3e}
.art-security .keybox::after{content:"";position:absolute;left:44%;top:40%;width:8px;height:18px;background:var(--warn);opacity:.85}
/* office */
.art-office .win{left:3%;right:3%;top:8%;height:46%;border-width:5px}
.art-office .desks{position:absolute;left:0;right:0;bottom:0;height:40%}
.art-office .dk{position:absolute;bottom:14%;height:26%;background:linear-gradient(#202424,#121414);border-top:2px solid #2d3232}
.art-office .dk.cov{background:linear-gradient(rgba(170,185,190,.16),rgba(120,130,135,.08));border-top:2px solid rgba(190,200,205,.2)}
/* cctv */
.art-cctv canvas{position:absolute;inset:0;width:100%;height:100%}
/* basement */
.art-basement{background:linear-gradient(#0b0d0c,#070808)}
.art-basement .pipe{position:absolute;left:0;right:0;height:14px;background:linear-gradient(#3a3b36,#1c1d1a);box-shadow:0 2px 6px #000}
.art-basement .vpipe{position:absolute;top:0;bottom:0;width:16px;background:linear-gradient(90deg,#33342f,#191a17)}
.art-basement .door{position:absolute;right:8%;bottom:16%;width:22%;height:58%;background:repeating-linear-gradient(90deg,#3b3125 0 22px,#33291f 22px 24px);border:4px solid #4a4a46;box-shadow:inset 0 0 25px #000}
.art-basement .door::after{content:"출입금지";position:absolute;left:10%;right:10%;top:38%;text-align:center;font-size:.7rem;font-weight:700;color:#f2d8a0;background:#5b2020;padding:2px 0}
.art-basement .gap{position:absolute;right:8%;bottom:16%;width:22%;height:4px;background:#000;box-shadow:0 0 10px #000}
.drip{position:absolute;width:3px;height:7px;border-radius:50% 50% 60% 60%;background:rgba(170,200,205,.7);animation:drip 2.8s infinite ease-in}
@keyframes drip{0%{transform:translateY(0);opacity:0}10%{opacity:1}80%{opacity:1}100%{transform:translateY(160px);opacity:0}}
.puddle{position:absolute;bottom:8%;height:6px;border-radius:50%;background:rgba(160,190,200,.12);animation:pulse 2.8s infinite}
.art-basement .term{position:absolute;left:30%;top:30%;width:7%;height:16%;background:#151a16;border:3px solid #333;box-shadow:0 0 14px rgba(127,209,138,.25)}
.art-basement .term::after{content:"";position:absolute;inset:3px;background:#173a1f;opacity:.9}
/* outside */
.art-outside .win{inset:0;border:0}
/* static overlay */
#artBox.static::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.08) 0 1px,rgba(0,0,0,.2) 1px 3px);animation:stat .12s steps(2) infinite;mix-blend-mode:screen}
@keyframes stat{50%{transform:translateY(2px)}}


/* overlays & modals */
.overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px}
.overlay.show{display:flex}
#title{background:rgba(5,6,7,.82);z-index:30}
.tbox{max-width:560px;text-align:center}
.tbox h1{font-size:clamp(2rem,6vw,3.2rem);margin:0 0 6px;letter-spacing:.08em;text-shadow:0 0 18px rgba(207,227,208,.25)}
.tbox .sub{color:var(--dim);margin:0 0 6px}
.tbox .print{font-family:var(--mono);color:var(--crt);margin:16px 0 22px;font-size:.95rem}
.tbox .btns{display:flex;flex-direction:column;gap:8px;align-items:stretch;max-width:340px;margin:0 auto}
.bigbtn{min-height:50px;background:#171b1d;border:1px solid var(--line2);border-radius:6px;font-size:1rem}
.bigbtn:hover,.bigbtn:focus-visible{border-color:var(--text);outline:none;background:#1f2427}
.bigbtn.primary{border-color:#3d6447;color:var(--crt);background:#18241b}
.tbox .warn{font-size:.82rem;color:var(--faint);margin-top:18px}
#card{background:#050606;z-index:25;flex-direction:column;opacity:0;transition:opacity .6s}
#card.vis{opacity:1}
#card .cnum{font-family:var(--mono);color:var(--faint);letter-spacing:.3em}
#card .ctitle{font-size:clamp(1.6rem,5vw,2.4rem);font-weight:700;margin-top:6px}
#stamp{z-index:24;pointer-events:none}
/* 하루가 바뀔 때: 암전 → DAY N → 다음 날 밤 */
#dayCard{background:#000;z-index:26;flex-direction:column;opacity:0;transition:opacity .9s ease}
#dayCard.vis{opacity:1}
#dayCard .dnum{font-family:var(--mono);font-size:clamp(2.4rem,8vw,4.6rem);font-weight:700;letter-spacing:.38em;padding-left:.38em;color:#cfe3d0;
  opacity:0;transform:translateY(6px);transition:opacity 1s ease .55s,transform 1s ease .55s;text-shadow:0 0 22px rgba(207,227,208,.18)}
#dayCard .dline{width:0;height:1px;background:#4a524d;margin:16px 0 12px;transition:width 1.1s ease .9s}
#dayCard .dsub{font-family:var(--mono);color:#8e9b93;letter-spacing:.18em;opacity:0;transition:opacity 1s ease 1.1s}
#dayCard.vis .dnum{opacity:1;transform:none}
#dayCard.vis .dline{width:140px}
#dayCard.vis .dsub{opacity:1}
#stamp .st{font-family:var(--mono);font-size:clamp(1.5rem,5vw,2.6rem);font-weight:700;color:#e2706a;border:4px solid #c2453f;padding:10px 26px;transform:rotate(-6deg) scale(1.6);opacity:0;transition:all .5s cubic-bezier(.2,1.6,.4,1);background:rgba(10,10,10,.75)}
#stamp.show .st{transform:rotate(-6deg) scale(1);opacity:1}
#modal{background:rgba(0,0,0,.72)}
.mbox{width:min(920px,100%);max-height:88vh;display:flex;flex-direction:column;background:#121416;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;font-size:1.05rem}
.mbody{padding:14px;overflow:auto}
.cluegrid{display:grid;grid-template-columns:minmax(200px,1fr) 2fr;gap:12px}
.clist{display:flex;flex-direction:column;gap:5px}
.ci{text-align:left;min-height:44px;background:#181b1d;border:1px solid var(--line2);border-radius:4px;padding:6px 10px}
.ci small{font-family:var(--mono);color:var(--amber);margin-right:6px}
.ci:hover,.ci:focus-visible{border-color:var(--text);outline:none}
.ci.sel{border-color:var(--amber);background:#211f17}
.ci.unk{color:var(--faint);border-style:dashed;cursor:default}
.paperbox{background:var(--paper);color:var(--ink);border-radius:2px;padding:16px 18px;box-shadow:0 4px 14px rgba(0,0,0,.5);
  background-image:linear-gradient(rgba(0,0,0,.05) 1px,transparent 1px);background-size:100% 22px}
.paperbox h4{margin:0 0 2px;font-size:1.05rem}
.paperbox .where{font-size:.8rem;color:#6b6352;margin-bottom:8px}
.paperbox pre{font-family:var(--mono);white-space:pre-wrap;margin:0 0 10px;font-size:.88rem;line-height:1.55}
.paperbox .mean{border-top:1px dashed #8b8370;padding-top:8px;font-size:.92rem}
/* 단서 사진: 발견 순간 크게, 단서 목록에서는 본문 위에 */
.clueimg{display:block;max-width:100%;max-height:34vh;margin:0 auto 10px;filter:drop-shadow(0 6px 16px rgba(0,0,0,.6))}
.cluereveal{text-align:center}
.cluereveal .clueimg{max-height:62vh;margin-bottom:12px;animation:cluein .5s ease-out}
.cluereveal p{margin:0;color:var(--faint);font-size:.9rem}
@keyframes cluein{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.presentbtn{margin-top:12px;width:100%;min-height:48px;background:#3a1f1d;border:1px solid var(--warn);color:#f3d1cc;border-radius:5px;font-weight:700}
.presentbtn:hover{background:#4a2522}
.loglist p{margin:0 0 8px}
.loglist .ln{font-weight:700;margin-right:6px}
.loglist .n{color:#a9b6ad}
.loglist .sys{font-family:var(--mono);color:var(--crt)}
.qset{border:1px solid var(--line2);border-radius:6px;padding:10px 12px;margin:0 0 12px}
.qset legend{padding:0 6px;font-weight:700}
.qset label{display:flex;gap:8px;align-items:flex-start;padding:7px 6px;border-radius:4px;cursor:pointer}
.qset label:hover{background:#1b1f21}
.qset input{margin-top:5px;accent-color:var(--amber)}
.qset.bad{border-color:var(--warn)}
.qset.good{border-color:#3d6447}
.qres{font-size:.9rem;margin-top:4px}
.qres.bad{color:#e3a19b}.qres.good{color:var(--crt)}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line)}
#summary{background:rgba(4,5,6,.9);z-index:26}
.report{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--paper);color:var(--ink);padding:24px 26px;border-radius:2px;box-shadow:0 10px 40px #000}
.report h2{margin:0 0 4px;font-family:var(--mono)}
.report .stamp2{display:inline-block;border:3px solid #a33;color:#a33;font-family:var(--mono);font-weight:700;padding:2px 10px;transform:rotate(-3deg);margin:6px 0 12px}
.report dt{font-weight:700;margin-top:10px}
.report dd{margin:2px 0 0}
.report ol{margin:4px 0 0;padding-left:20px;font-family:var(--mono);font-size:.9rem}
.report .last{font-style:italic;margin-top:16px;border-top:1px dashed #8b8370;padding-top:10px}
.report .bigbtn{color:var(--text);margin-top:16px;width:100%}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%) translateY(-10px);z-index:22;background:#1c1a12;border:1px solid #6b5a32;color:var(--amber);
  padding:8px 16px;border-radius:5px;opacity:0;transition:all .35s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---- 딱딱하고 어두운 톤 (덮어쓰기) ---- */
#top,#viewWrap,#dialog,#artBox,.mbox,.report,.paperbox,.qset,button,.pill,.obj .bd,#toast{border-radius:0 !important}
#top,#viewWrap{background:rgba(8,9,10,.96);border-color:#1f2224}
#dialog{background:rgba(6,7,8,.98);border-color:#24282a;border-left:3px solid #3a3f3c}
.tbtn{background:#0c0d0e;border:1px solid #26292b;color:#a9b5ad;letter-spacing:.03em}
.tbtn:hover,.tbtn:focus-visible{background:#121415;border-color:#6d7570;color:#dfe9e1}
.tbtn.danger{background:#0c0d0e;border-color:#3d1c1c;color:#b88a8a}
.tbtn.danger:hover{border-color:#7a2a2a;color:#e0b0b0}
.pill{background:#0c0d0e;border-color:#3a3224;color:#b89a5c}
.obj{background:#0b0c0d;border:1px solid #1f2224;border-left:3px solid #33383a;color:#c3d0c6}
.obj:hover,.obj:focus-visible{background:#111314;border-color:#3a3f3c;border-left-color:#9aa59e}
.obj.new{border-left-color:#8a6b2c}
.obj.new .bd{background:#2a2112;color:#d6b26a;border-color:#5a4520;animation:pulse 1.6s infinite}
.obj.todo .bd,.obj.flavor .bd{background:transparent;border-color:#2c3032;color:#7f8a83;border-style:solid}
.obj.repeat{border-left-color:#3d5a45}
.obj.repeat .bd{color:#8fb79a;border-color:#2c4233}
#proceed{background:#0b0d0c;border:1px solid #2c3a30;color:#8fbf98;letter-spacing:.04em}
#proceed:hover:not(:disabled){background:#0f1511;border-color:#5f8f69}
#proceed:disabled{background:#0a0b0c;border-color:#1c1f20;color:#4a524d}
.loc{background:rgba(8,9,10,.96);border:1px solid #1f2224;color:#b7c3ba}
.loc:hover,.loc:focus-visible{border-color:#5c635f}
.loc.here{border-color:#2f4a36;box-shadow:inset 0 -2px 0 #6faa7a;color:#dfe9e1}
.choice{background:#0b0c0d;border:1px solid #23272a;border-left:3px solid #3a3f3c}
.choice::before{content:"▸ ";color:#5d6862}
.choice:hover,.choice:focus-visible{background:#111314;border-left-color:#c7d3ca}
.choice.key{border-left-color:#8a6b2c;color:#d6b26a}
.bigbtn{background:#0b0c0d;border:1px solid #2a2e30}
.bigbtn.primary{background:#0b100c;border-color:#2f4a36;color:#8fbf98}
.ci{background:#0c0d0e;border-color:#23272a}
.mbox{background:#090a0b;border-color:#24282a}

/* 강태식 초상 */
#portrait{position:absolute;right:0;top:0;bottom:0;width:44%;z-index:7;pointer-events:none;opacity:0;transform:translateX(14px);
  transition:opacity .45s ease, transform .45s ease}
#portrait img{width:100%;height:100%;object-fit:contain;object-position:50% 100%;display:block;
  filter:brightness(.92) contrast(1.06) drop-shadow(0 0 18px rgba(0,0,0,.7));transition:filter .45s}
#portrait.on{opacity:1;transform:none}
#portrait.on.dim{opacity:.38}
#portrait.phone img{filter:grayscale(.65) brightness(.72) contrast(1.2) drop-shadow(0 0 18px rgba(0,0,0,.7))}
#portrait.phone::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);
  -webkit-mask:url('assets/kang.webp') 50% 100%/contain no-repeat;mask:url('assets/kang.webp') 50% 100%/contain no-repeat}
#portrait .ptag{position:absolute;right:8px;top:8px;z-index:1;display:none;font-family:var(--mono);font-size:.72rem;color:#8fbf98;background:rgba(0,0,0,.75);border:1px solid #2c4233;padding:1px 7px}
#portrait.phone .ptag{display:block}

/* 프린터: 클릭 영역 + 상태 램프 (관리실.png의 프린터 위치에 맞춤) */
.printer-hot{position:absolute;left:79.6%;top:58.2%;width:15.6%;height:15.8%;z-index:5;cursor:pointer;outline:1px solid transparent;transition:outline-color .2s,background .2s}
.printer-hot:hover{outline-color:rgba(200,210,205,.35);background:rgba(200,210,205,.04)}
.printer-led{position:absolute;left:94.22%;top:63%;width:.75%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50% !important;z-index:5;pointer-events:none;opacity:0}
.printer-led.alert{animation:ledred 1.1s steps(1) infinite}
@keyframes ledred{0%{opacity:1;background:radial-gradient(circle,#ffd2c8 0,#ff2a14 45%,#b30d00 100%);box-shadow:0 0 6px 2px rgba(255,40,20,.85),0 0 22px 6px rgba(255,40,20,.35)}55%{opacity:0}}
body.locked-ui .printer-hot{pointer-events:none}

/* 출력된 종이 */
.printout{position:relative;width:min(560px,100%);margin:6px auto 4px;padding:30px 34px 22px;background:#ecebe3;color:#1e1c18;
  font-family:var(--mono);transform:rotate(-.8deg);box-shadow:0 14px 34px rgba(0,0,0,.75),0 0 0 1px rgba(0,0,0,.25);
  background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.018) 0 1px,transparent 1px 4px),radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.5),rgba(0,0,0,.05))}
.printout::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(rgba(0,0,0,.12),transparent)}
.pt-head{display:flex;flex-direction:column;gap:2px;border-bottom:2px solid #1e1c18;padding-bottom:8px;margin-bottom:18px;font-size:.82rem}
.pt-head b{font-size:.95rem;letter-spacing:.02em}
.pt-main{font-size:clamp(1.05rem,2.6vw,1.35rem);font-weight:700;padding:14px 0;border-top:1px dashed #6d685c;border-bottom:1px dashed #6d685c;margin-bottom:16px;letter-spacing:.02em}
.pt-table{border-collapse:collapse;font-size:.85rem;width:100%}
.pt-table th{text-align:left;font-weight:400;color:#57524a;width:7.5em;padding:3px 0;vertical-align:top}
.pt-table td{padding:3px 0}
.pt-foot{text-align:center;font-size:.75rem;color:#6d685c;margin-top:22px}

/* =========================================================
   풀스크린 레이아웃 (스크롤 없음)
   ========================================================= */
html,body{overflow:hidden}
#app{position:fixed;inset:0;max-width:none;margin:0;padding:0;display:block;height:auto}
#stage{position:absolute;inset:0;overflow:hidden;background:#050606;z-index:0}
/* 16:9 장면을 화면에 꽉 채운다 (넘치는 가장자리는 잘림) — 내부 좌표(%)가 사진과 맞도록 비율 고정 */
#artBox{position:absolute;left:50%;top:50%;width:max(100vw, 177.78vh);height:max(56.25vw, 100vh);max-width:none;aspect-ratio:auto;
  transform:translate(-50%,-50%);margin:0;border:0}
#vignette{position:absolute;z-index:1}
#flash{position:absolute;z-index:2}
#portrait{position:absolute;right:2vw;left:auto;top:auto;bottom:0;height:min(88vh,1000px);width:auto;aspect-ratio:1216/1282;z-index:3}
#portrait .ptag{top:auto;bottom:calc(100% - 40px);right:14px}

#top{position:absolute;left:0;right:0;top:0;z-index:6;border:0 !important;padding:10px 18px 26px;
  background:linear-gradient(rgba(0,0,0,.82),rgba(0,0,0,.55) 55%,rgba(0,0,0,0)) !important}
#locLabel{position:absolute;left:18px;top:66px;z-index:5;display:flex;align-items:center;gap:8px;pointer-events:none;
  text-shadow:0 2px 10px #000,0 0 2px #000}
#locLabel #locFloor{font-family:var(--mono);font-size:.75rem;color:#0b0c0d;background:#9aa59e;padding:0 6px}
#locLabel #locName{font-size:1.15rem;font-weight:700;letter-spacing:.06em;color:#dfe9e1}

#dialog{position:absolute;z-index:7;left:50%;transform:translateX(-50%);bottom:14px;width:min(1100px,calc(100vw - 24px));
  min-height:132px;max-height:46vh;overflow:auto;
  background:linear-gradient(rgba(4,5,6,.80),rgba(4,5,6,.93)) !important;backdrop-filter:blur(2px)}
#exploreBar{display:none;margin-top:10px;gap:6px;align-items:stretch;flex-wrap:wrap}
#dialog.explore #exploreBar{display:flex}
#exploreBar #locBar{display:flex;gap:6px;flex:1;flex-wrap:wrap}
#exploreBar .loc{flex:1;min-width:96px;min-height:42px;padding:4px 8px;font-size:.9rem}
#exploreBar .loc small{font-size:.65rem}
#btnDrawer{min-width:150px;font-weight:700;color:#dfe9e1;border-left:3px solid #6f7a73}
#btnDrawer.has-new{border-left-color:#d6b26a;color:#d6b26a;animation:pulse 1.6s infinite}
#barProceed{min-width:170px;font-weight:700;color:#8fbf98;border-color:#2f4a36;border-left:3px solid #6faa7a}
body.locked-ui #exploreBar{display:none !important}

#drawer{position:absolute;z-index:8;right:12px;top:62px;width:min(380px,calc(100vw - 24px));
  max-height:calc(100vh - 62px - 200px);overflow:auto;display:flex;flex-direction:column;gap:10px;
  background:rgba(5,6,7,.95);border:1px solid #24282a;border-left:3px solid #3a3f3c;padding:12px 14px;
  transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none;transition:transform .3s ease,opacity .3s ease}
#drawer.open{transform:none;opacity:1;pointer-events:auto}
#drawer .dhead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1f2224;padding-bottom:6px}
#drawer .dhead .tbtn{min-height:34px;padding:2px 10px}
body.locked-ui #drawer{transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none}

/* 타이틀 화면에서만 화면 전체에 비 */
#bgRain{z-index:31;display:none;opacity:.55}
body.at-title #bgRain{display:block}
#title .tbox{position:relative;z-index:32}

/* 시작 화면: 건물 외관 + 1인칭으로 입구에 들어가기 */
#title{background:#030404;overflow:hidden;justify-content:center;padding:16px}
.title-cam{position:absolute;inset:0;z-index:30}
/* 처음엔 거의 보이지 않을 만큼 어둡다 */
.title-bg{position:absolute;inset:-2%;background-size:cover;background-position:62% 60%;
  filter:brightness(.2) contrast(1.1) saturate(.7);transform-origin:64.5% 74%;will-change:transform,filter;
  transition:filter 1.1s ease}
.title-shade{position:absolute;inset:0;z-index:30;pointer-events:none;transition:opacity 1s;
  background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,.55) 0,rgba(0,0,0,.25) 45%,rgba(0,0,0,.75) 100%)}
#title .tbox{text-align:center;max-width:460px;width:100%;transition:opacity .7s}
#title .tbox .btns{margin:0 auto;max-width:300px}
#title .tbox .bigbtn{min-height:54px;font-size:1.05rem;letter-spacing:.12em;background:rgba(8,9,10,.7);border-color:#3a3f3c}
#title .tbox .bigbtn:hover,#title .tbox .bigbtn:focus-visible{background:rgba(20,22,23,.85);border-color:#c7d3ca}
#title .tbox .bigbtn.primary{border-color:#4d6b55;color:#cfe3d0}
/* 클릭 → 살짝 밝아진다 */
#title.lit .tbox{opacity:0;pointer-events:none}
#title.lit .title-shade{opacity:.35}
#title.lit .title-bg{filter:brightness(.62) contrast(1.08) saturate(.85)}
#title .tbox h1{text-shadow:0 2px 18px #000,0 0 18px rgba(207,227,208,.2)}
#title .tbox .sub,#title .tbox .warn{text-shadow:0 1px 6px #000}
/* 걸어 들어가기 */
#title.walking .title-shade{opacity:0}
#title.walking .title-cam{animation:bob .62s ease-in-out infinite}
#title.walking .title-bg{animation:walkin 4.6s cubic-bezier(.45,.05,.75,.6) forwards}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-.7%) rotate(-.25deg)}50%{transform:translateY(.25%) rotate(0)}75%{transform:translateY(-.7%) rotate(.25deg)}}
@keyframes walkin{
  0%{transform:scale(1);filter:brightness(.62) contrast(1.08) saturate(.85) blur(0)}
  70%{transform:scale(2.6);filter:brightness(.5) contrast(1.1) saturate(.8) blur(0)}
  88%{transform:scale(4.4);filter:brightness(.25) contrast(1.15) saturate(.7) blur(1px)}
  100%{transform:scale(6.5);filter:brightness(0) blur(3px)}}
@media (prefers-reduced-motion:reduce){
  #title.walking .title-cam{animation:none}
  #title.walking .title-bg{animation:none;transition:filter 1.2s;filter:brightness(0)}
}

/* =========================================================
   모바일
   ========================================================= */
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#dialog,#top,#exploreBar,#drawer{-webkit-user-select:none;user-select:none}
/* 장면 사진을 흐리게 깔아 빈 공간을 채운다 (세로 화면에서 보임) */
#stage::before{content:"";position:absolute;inset:-8%;background:var(--scene,none) center/cover no-repeat;
  filter:blur(22px) brightness(.32) saturate(.7);transform:scale(1.05)}

@media (max-width:820px){
  .cluegrid{grid-template-columns:1fr}
  #top{padding:8px 10px 18px;gap:6px}
  #chapTitle{font-size:.86rem}
  #clock{font-size:.72rem}
  .tb-right{gap:4px}
  .tbtn{min-height:38px;min-width:40px;padding:4px 9px;font-size:.8rem}
  .pill{font-size:.72rem;padding:2px 7px}
  .mbox{max-height:92dvh}
  .mhead{padding:8px 10px}
  .mbody{padding:10px}
  .mfoot{padding:8px 10px}
  .printout{padding:20px 18px 16px;transform:rotate(-.5deg)}
  .report{padding:18px 16px}
  #toast{top:auto;bottom:calc(52vh + 12px);font-size:.85rem}
}

#dialog.explore #dlgName{display:none}

/* 세로 화면 휴대폰: 상단 바 → 16:9 장면(장소별 확대) → 대사창 */
@media (orientation:portrait) and (max-width:900px){
  #top{flex-direction:column;align-items:stretch;gap:6px;padding:8px 10px 14px}
  .tb-right{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .tb-right::-webkit-scrollbar{display:none}
  .tb-right .tbtn,.tb-right .pill{flex:0 0 auto}
  .tb-right .tbtn{min-height:36px;padding:4px 8px;font-size:.78rem}
  /* 장면 높이: 장소별 배율만큼 키우되, 대사창(약 290px)을 넘지 않게 제한 */
  #artBox{--sh:min(calc(56.25vw * var(--zs,1)), calc(100dvh - var(--topH,64px) - 320px));
    transform:none;
    width:calc(var(--sh) * 16 / 9);height:var(--sh);
    left:calc((100vw - var(--sh) * 16 / 9) * var(--fx,.5));
    /* 상단 바와 대사창 사이 가운데 — 대사 길이에 따라 움직이지 않도록 고정값 */
    top:max(calc(var(--topH,64px) + 30px), calc(var(--topH,64px) + (100dvh - var(--topH,64px) - 290px - var(--sh)) / 2));
    box-shadow:0 10px 40px rgba(0,0,0,.8),0 -10px 40px rgba(0,0,0,.8)}
  #locLabel{top:calc(var(--topH,64px) + 4px);left:12px}
  #locLabel #locName{font-size:1rem}
  #vignette{background:radial-gradient(ellipse at 50% 30%,rgba(0,0,0,0) 40%,rgba(0,0,0,var(--vig)) 100%)}
  #dialog{left:8px;right:8px;width:auto;transform:none;bottom:8px;min-height:150px;max-height:54dvh;padding:12px 14px 14px}
  #dlgText{font-size:1rem;line-height:1.65}
  #dlgNext{bottom:6px;right:12px}
  .choice{min-height:40px;padding:7px 10px;font-size:.92rem;line-height:1.45}
  #dlgChoices{gap:5px}
  #artBox{transition:height .3s ease,width .3s ease,left .3s ease,top .3s ease}
  /* 선택지가 뜨면 장면을 줄여 대사창(--dlgH) 위로 올린다 */
  #app:has(#dlgChoices:not(:empty)) #artBox{
    --sh:max(100px, min(calc(56.25vw * var(--zs,1)), calc(100dvh - var(--topH,64px) - var(--dlgH,290px) - 24px)));
    top:calc(var(--topH,64px) + 8px)}
  #app:has(#dlgChoices:not(:empty)) #dialog{max-height:calc(100dvh - var(--topH,64px) - 124px)}
  #exploreBar{flex-direction:column;gap:6px}
  #btnDrawer,#barProceed{width:100%;min-height:46px}
  #exploreBar #locBar{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  #exploreBar .loc{min-width:0;min-height:44px}
  /* 조사할 곳: 아래에서 올라오는 시트 */
  #drawer{left:8px;right:8px;width:auto;top:auto;bottom:8px;max-height:72dvh;z-index:9;
    transform:translateY(calc(100% + 24px));border-left:1px solid #24282a;border-top:3px solid #3a3f3c}
  #drawer.open{transform:none}
  body.locked-ui #drawer{transform:translateY(calc(100% + 24px))}
  .obj{min-height:50px}
  #portrait{right:-4vw;bottom:auto;top:calc(var(--topH,64px) + 8px);height:min(50dvh,118vw)}
  #portrait .ptag{bottom:auto;top:8px;right:8vw}
  #title .tbox h1{font-size:2.1rem}
}

/* 가로 화면 휴대폰: 화면 높이가 낮다 */
@media (max-height:500px) and (orientation:landscape){
  /* 장면 전체가 화면 높이에 들어오게 (양옆은 흐린 배경) */
  #artBox{width:177.78vh;height:100vh;left:50%;top:0;transform:translateX(-50%)}
  /* 조사 중에는 대사창을 버튼 한 줄로 줄여 장면을 가리지 않는다 (힌트는 수첩) */
  #dialog.explore{min-height:0;padding:6px 8px}
  #dialog.explore #dlgText{display:none}
  #dialog.explore #exploreBar{margin-top:0;flex-wrap:nowrap}
  #top{padding:5px 12px 12px}
  #chapTitle{font-size:.8rem} #clock{font-size:.7rem}
  .tbtn{min-height:32px;padding:2px 8px;font-size:.76rem}
  #locLabel{top:44px}
  #locLabel #locName{font-size:.95rem}
  #dialog{min-height:92px;max-height:56vh;padding:8px 12px 10px;bottom:6px}
  #dlgText{font-size:.95rem;min-height:2.3em}
  #exploreBar{margin-top:6px}
  #exploreBar .loc{min-height:36px;padding:2px 6px}
  #btnDrawer,#barProceed{min-height:36px}
  #drawer{top:42px;max-height:calc(100vh - 42px - 110px)}
  #portrait{height:96vh}
  #dayCard .dnum{font-size:2.2rem}
  #title .tbox h1{font-size:1.8rem}
  #title .tbox .print,#title .tbox .sub{margin:4px 0}
  #title .tbox .bigbtn{min-height:44px}
}
@media (prefers-reduced-motion:reduce){
  #app.flick,#app.flick-soft{animation:none}
  .drip,.obj.new .bd,#dlgNext,.led,.puddle,.tubelight,.screenglow{animation:none}
  .printer-led.alert{animation:none;opacity:1;background:#ff2a14;box-shadow:0 0 6px 2px rgba(255,40,20,.85)}
}
</style>
</head>
<body class="at-title">

      inspected:state.inspected, flags:state.flags, asked:state.asked, log:state.log.slice(-300), receipt:state.receipt, receiptUnread:state.receiptUnread};

const Snd = {
  ctx:null, on:false, vol:0.85, loc:'security', rainAmt:1,
  init(){
    if (this.ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try{
      const c = this.ctx = new AC();
      this.master = c.createGain(); this.master.gain.value = 0; this.master.connect(c.destination);
      this.white = this.noise('white'); this.pink = this.noise('pink'); this.brown = this.noise('brown');
      // 빗소리 버스
      this.rainBus = c.createGain(); this.rainBus.gain.value = 0.9;
      this.rainLP = c.createBiquadFilter(); this.rainLP.type='lowpass'; this.rainLP.frequency.value = 2400;
      this.rainBus.connect(this.rainLP); this.rainLP.connect(this.master);
      const loop = (buf, filt, f, g, q)=>{
        const s = c.createBufferSource(); s.buffer = buf; s.loop = true;
        const fl = c.createBiquadFilter(); fl.type = filt; fl.frequency.value = f; if(q) fl.Q.value = q;
        const gn = c.createGain(); gn.gain.value = g;
        s.connect(fl); fl.connect(gn); gn.connect(this.rainBus); s.start(0, Math.random()*3);
        return gn;
      };
      this.rainBody = loop(this.pink,'bandpass',900,0.55,0.5);   // 쏟아지는 빗줄기
      this.rainHiss = loop(this.white,'highpass',5200,0.05);     // 유리창 치는 고음
      this.rainRoof = loop(this.brown,'lowpass',260,0.5);         // 건물 전체의 낮은 울림
      // 형광등 험
      const o = c.createOscillator(); o.type='sawtooth'; o.frequency.value = 120;
      const hl = c.createBiquadFilter(); hl.type='lowpass'; hl.frequency.value = 240;
      this.hum = c.createGain(); this.hum.gain.value = 0.014;
      o.connect(hl); hl.connect(this.hum); this.hum.connect(this.master); o.start();
      // 지하 기계음
      const m = c.createOscillator(); m.type='triangle'; m.frequency.value = 48;
      this.machine = c.createGain(); this.machine.gain.value = 0;
      m.connect(this.machine); this.machine.connect(this.master); m.start();
      this.tick = setInterval(()=>this.ambientTick(), 40);
      return true;
    }catch(e){ this.ctx = null; return false; }
  },
  noise(type){
    const c = this.ctx, len = c.sampleRate*4, buf = c.createBuffer(1,len,c.sampleRate), d = buf.getChannelData(0);
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0,last=0;
    for (let i=0;i<len;i++){
      const w = Math.random()*2-1;
      if (type==='white') d[i]=w*0.5;
      else if (type==='pink'){
        b0=.99886*b0+w*.0555179; b1=.99332*b1+w*.0750759; b2=.969*b2+w*.153852; b3=.8665*b3+w*.3104856;
        b4=.55*b4+w*.5329522; b5=-.7616*b5-w*.016898; d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11; b6=w*.115926;
      } else { last=(last+.02*w)/1.02; d[i]=last*3.2; }
    }
    return buf;
  },
  ambientTick(){
    if (!this.ctx || !this.on) return;
    const c = this.ctx, t = c.currentTime;
    // 빗방울 하나하나
    const p = this.loc==='basement' ? 0 : (this.loc==='cctv' ? .18 : .5) * this.rainAmt;
    if (Math.random() < p){
      const s = c.createBufferSource(); s.buffer = this.white;
      const bp = c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = 1500+Math.random()*5000; bp.Q.value = 4+Math.random()*10;
      const g = c.createGain(); const pk = .015+Math.random()*.06;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(pk,t+.002); g.gain.exponentialRampToValueAtTime(.0001,t+.03+Math.random()*.06);
      s.connect(bp); bp.connect(g); g.connect(this.rainBus); s.start(t, Math.random()*3, .12);
    }
  },
  setLoc(loc){
    this.loc = loc;
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const P = {
      security:{bus:.9, lp:2600, hum:.014},
      cctv:{bus:.4, lp:900, hum:.02},
      office:{bus:1.0, lp:3200, hum:.01},
      basement:{bus:.16, lp:260, hum:0},
      outside:{bus:1.15, lp:5200, hum:0},
      shaft:{bus:.12, lp:220, hum:0}
    }[loc] || {bus:.9, lp:2600, hum:.014};
    this.rainBus.gain.setTargetAtTime(P.bus*this.rainAmt, t, .5);
    this.rainLP.frequency.setTargetAtTime(P.lp, t, .4);
    this.humLevel = P.hum;
    this.hum.gain.setTargetAtTime(P.hum, t, .3);
  },
  setRainAmt(a){ this.rainAmt = a; this.setLoc(this.loc); },
  enable(){
    if (!this.init()) return false;
    this.on = true; if (this.ctx.state==='suspended') this.ctx.resume();
    this.master.gain.setTargetAtTime(this.vol, this.ctx.currentTime, .4);
    this.setLoc(this.loc); return true;
  },
  disable(){ this.on = false; if (this.ctx) this.master.gain.setTargetAtTime(0, this.ctx.currentTime, .1); },
  // 정적: 빗소리는 그대로 두고 형광등 험·기계음만 끊는다
  silence(ms){
    if (!this.ctx || !this.on) return;
    const t = this.ctx.currentTime;
    [[this.hum, this.humLevel || 0], [this.machine, this.machine.gain.value]].forEach(([n, back])=>{
      n.gain.cancelScheduledValues(t);
      n.gain.setTargetAtTime(0, t, .04);
      n.gain.setTargetAtTime(back, t+ms/1000, .5);
    });
  },
  // 대사 타자 소리: 짧은 노이즈 클릭
  key(){
    if (!this.ctx || !this.on) return;
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.white;
    const bp = c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = 2600 + Math.random()*1800; bp.Q.value = 2.5;
    const g = c.createGain(); this.env(g, t, .001, .05 + Math.random()*.03, .035);
    s.connect(bp); bp.connect(g); g.connect(this.master); s.start(t, Math.random()*3, .06);
    const k = c.createBufferSource(); k.buffer = this.brown;
    const kl = c.createBiquadFilter(); kl.type='lowpass'; kl.frequency.value = 420;
    const kg = c.createGain(); this.env(kg, t, .001, .09, .03);
    k.connect(kl); kl.connect(kg); kg.connect(this.master); k.start(t, Math.random()*3, .05);
  },
  env(node, t, a, peak, d){ node.gain.setValueAtTime(0,t); node.gain.linearRampToValueAtTime(peak,t+a); node.gain.exponentialRampToValueAtTime(.0001,t+a+d); },
  printer(){
    if (!this.ctx || !this.on) return;
    const c0 = this.ctx, b0 = c0.currentTime + .02;
    // 출력 알림음: 삐-삐-삐
    [0,.22,.44].forEach(dt=>{
      const o = c0.createOscillator(); o.type='square'; o.frequency.value = 2050;
      const lp = c0.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 3200;
      const g = c0.createGain(); g.gain.setValueAtTime(0,b0+dt); g.gain.linearRampToValueAtTime(.05,b0+dt+.005);
      g.gain.setValueAtTime(.05,b0+dt+.12); g.gain.linearRampToValueAtTime(0,b0+dt+.135);
      o.connect(lp); lp.connect(g); g.connect(this.master); o.start(b0+dt); o.stop(b0+dt+.15);
    });
    // 이어서 종이가 밀려 나오는 기계음
    const c = this.ctx, t = c.currentTime + .75;
    const o = c.createOscillator(); o.type='square'; o.frequency.value = 74;
    const lp = c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 700;
    const g = c.createGain(); g.gain.setValueAtTime(0,t);
    for (let i=0;i<12;i++){ g.gain.linearRampToValueAtTime(.06,t+i*.19+.02); g.gain.linearRampToValueAtTime(.018,t+i*.19+.15); }
    g.gain.linearRampToValueAtTime(0,t+2.4);
    o.connect(lp); lp.connect(g); g.connect(this.master); o.start(t); o.stop(t+2.5);
    const s = c.createBufferSource(); s.buffer = this.white;
    const bp = c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = 2800; bp.Q.value = .8;
    const g2 = c.createGain(); g2.gain.setValueAtTime(0,t); g2.gain.linearRampToValueAtTime(.035,t+.3); g2.gain.setValueAtTime(.035,t+2.1); g2.gain.linearRampToValueAtTime(0,t+2.4);
    s.connect(bp); bp.connect(g2); g2.connect(this.master); s.start(t,0,2.5);
    const k = c.createBufferSource(); k.buffer = this.brown;
    const kg = c.createGain(); this.env(kg, t, .005, .5, .18);
    k.connect(kg); kg.connect(this.master); k.start(t,0,.3);
  },
  staticBurst(){
    if (!this.ctx || !this.on) return;
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.white;
    const hp = c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value = 900;
    const g = c.createGain(); this.env(g, t, .01, .16, .8);
    s.connect(hp); hp.connect(g); g.connect(this.master); s.start(t,0,1);
  },
  clue(){
    if (!this.ctx || !this.on) return;
    const c = this.ctx, t = c.currentTime;
    [[392,0],[587,.12]].forEach(([f,dt])=>{
      const o = c.createOscillator(); o.type='sine'; o.frequency.value = f;
      const g = c.createGain(); this.env(g, t+dt, .01, .07, .9);
      o.connect(g); g.connect(this.master); o.start(t+dt); o.stop(t+dt+1);
    });
  },
  thunder(){
    if (!this.ctx || !this.on || this.loc==='basement') return;
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.brown;
    const lp = c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(320,t); lp.frequency.exponentialRampToValueAtTime(70,t+4);
    const g = c.createGain(); const vol = this.loc==='cctv' ? .25 : .65;

    s.connect(lp); lp.connect(g); g.connect(this.master); s.start(t,0,5.2);

  step(alt){
    if (!this.ctx || !this.on) return;

  },
  door(){

    o.connect(bp); bp.connect(g); g.connect(this.master); o.start(t); o.stop(t+.9);
    const k = c.createBufferSource(); k.buffer = this.brown;
    const kl = c.createBiquadFilter(); kl.type='lowpass'; kl.frequency.value = 140;

  },
  flick(){

  // 수화기 대역(300~3400Hz)으로 걸러 master에 연결한다
  phoneOut(){

  tone(out, fs, t, dur, vol){

  },

  ring(n){
    const DTMF = [[941,1336],[697,1209],[697,1336],[770,1477],[852,1209],[770,1336],[697,1477],[852,1336]];
    const total = 900 + n*2000 + 300;
    if (!this.ctx || !this.on) return total;
    const out = this.phoneOut(), t0 = this.ctx.currentTime + .05;
    DTMF.forEach((fs,i)=>this.tone(out, fs, t0 + i*.1, .07, .05));
    for (let i=0;i<n;i++) this.tone(out, [440,480], t0 + .9 + i*2, 1, .05);   // 뚜-르르

  },
  // 상대가 끊은 뒤의 뚜뚜뚜
  hangup(){
    this.voiceStop();

    const out = this.phoneOut(), t0 = this.ctx.currentTime + .05;

    for (let i=0;i<3;i++) this.tone(out, [480,620], t0 + .3 + i*.5, .25, .045);
  },
  clickAt(t, vol){
    const k = this.ctx.createBufferSource(); k.buffer = this.brown;
    const kl = this.ctx.createBiquadFilter(); kl.type='lowpass'; kl.frequency.value = 900;
    const kg = this.ctx.createGain(); this.env(kg, t, .002, vol, .06);

  },
  // 전화 속 낮은 남자 목소리: 글자마다 음절 하나씩 웅얼거린다
  voice(text){
    this.voiceStop();
    if (!this.ctx || !this.on) return;
    const c = this.ctx, t0 = c.currentTime + .03;
    const o = c.createOscillator(); o.type='sawtooth';
    const f1 = c.createBiquadFilter(); f1.type='bandpass'; f1.Q.value = 5;
    const f2 = c.createBiquadFilter(); f2.type='bandpass'; f2.Q.value = 7;
    const g = c.createGain(); g.gain.value = 0;
    const sat = c.createWaveShaper(); const cv = new Float32Array(256);
    for (let i=0;i<256;i++){ const x = i/128-1; cv[i] = Math.tanh(x*2.2); } sat.curve = cv;
    o.connect(f1); o.connect(f2); f1.connect(g); f2.connect(g); g.connect(sat);

    let t = t0, base = 96;

      if (/[.,…?!—]/.test(ch)){ t += .22; base = 90 + Math.random()*14; continue; }
      if (/[“”‘’'"·\-]/.test(ch)) continue;
      const d = .1 + Math.random()*.06, pk = .5 + Math.random()*.35;
      o.frequency.setTargetAtTime(base * (.9 + Math.random()*.2), t, .03);
      f1.frequency.setTargetAtTime(380 + Math.random()*420, t, .02);
      f2.frequency.setTargetAtTime(950 + Math.random()*700, t, .02);
      g.gain.setTargetAtTime(pk, t, .015); g.gain.setTargetAtTime(.04, t + d*.7, .025);
      t += d; base *= .995;   // 말끝으로 갈수록 조금씩 처진다
      if (t - t0 > 8) break;
    }
    g.gain.setTargetAtTime(0, t, .04);
    o.start(t0); o.stop(t + .4);
    this.vc = {o, g};
  },
  voiceStop(){
    if (!this.vc) return;
    const t = this.ctx.currentTime, {o, g} = this.vc; this.vc = null;
    g.gain.cancelScheduledValues(t); g.gain.setTargetAtTime(0, t, .03);
    try{ o.stop(t + .2); }catch(e){}
  }
};

/* =========================================================
   비 (Canvas)
   ========================================================= */
class Rain{
  constructor(o){ this.o = o; this.c = null; this.ctx = null; this.drops = []; this.glass = []; this.flash = 0; this.amt = 1; }
  attach(c){ this.c = c; this.ctx = c ? c.getContext('2d') : null; this.resize(); }
  resize(){
    if (!this.c) return;
    const r = this.c.getBoundingClientRect(); if (!r.width || !r.height) return;
    const dpr = this.o.bg ? 1 : Math.min(window.devicePixelRatio||1, 2);
    this.dpr = dpr; this.w = this.c.width = Math.floor(r.width*dpr); this.h = this.c.height = Math.floor(r.height*dpr);
    const n = Math.min(1400, Math.floor(this.w*this.h/this.o.density));
    this.drops = Array.from({length:n}, ()=>this.newDrop(true));
    this.glass = this.o.glass ? Array.from({length:Math.floor(this.w*this.h/9000)+12}, ()=>this.newGlass(true)) : [];
    if (this.o.scenery) this.buildScenery();
  }
  newDrop(init){
    // z: 깊이(0.25 먼 비 ~ 1 가까운 비) — 멀수록 짧고 느리고 흐리다
    const d = this.dpr, z = .25 + Math.pow(Math.random(), 1.6)*.75;
    return {x:Math.random()*this.w*1.25 - this.w*.15, y: init ? Math.random()*this.h : -Math.random()*60*d, z,
      l:(6+z*26)*d*this.o.len, v:(9+z*22)*d*this.o.speed, a:.035+z*.15, lw:(.35+z*.75)*d};
  }
  newGlass(init){
    const d = this.dpr;
    return {x:Math.random()*this.w, y: init ? Math.random()*this.h : Math.random()*this.h*.3, r:(1+Math.random()*2.6)*d,
      v:0, hold:200+Math.random()*900};
  }
  buildScenery(){
    const w = this.w, h = this.h, d = this.dpr; this.bld = [];
    let x = -10*d;
    while (x < w){
      const bw = (50+Math.random()*90)*d, bh = h*(.35+Math.random()*.45);
      const wins = [];
      for (let yy = h-bh+12*d; yy < h-10*d; yy += 16*d) for (let xx = x+8*d; xx < x+bw-10*d; xx += 14*d)
        if (Math.random()<.035) wins.push([xx,yy, Math.random()<.5 ? 'rgba(214,178,106,.35)' : 'rgba(150,180,170,.22)']);
      this.bld.push({x, w:bw, h:bh, wins}); x += bw + (4+Math.random()*16)*d;
    }
    this.lamp = {x:w*(.2+Math.random()*.6), y:h*.52};
  }
  draw(dt, frozen){
    const ctx = this.ctx; if (!ctx || !this.w) return;
    ctx.clearRect(0,0,this.w,this.h);
    const d = this.dpr;
    if (this.o.scenery){
      const g = ctx.createLinearGradient(0,0,0,this.h); g.addColorStop(0,'#0b1114'); g.addColorStop(1,'#151d21');
      ctx.fillStyle = g; ctx.fillRect(0,0,this.w,this.h);
      const lg = ctx.createRadialGradient(this.lamp.x,this.lamp.y,0,this.lamp.x,this.lamp.y,this.h*.6);
      lg.addColorStop(0,'rgba(214,170,100,.22)'); lg.addColorStop(1,'rgba(214,170,100,0)');
      ctx.fillStyle = lg; ctx.fillRect(0,0,this.w,this.h);
      for (const b of this.bld){
        ctx.fillStyle = '#080b0c'; ctx.fillRect(b.x, this.h-b.h, b.w, b.h);
        for (const [x,y,c] of b.wins){ ctx.fillStyle = c; ctx.fillRect(x,y,6*d,8*d); }
      }
      ctx.fillStyle = 'rgba(214,170,100,.8)'; ctx.beginPath(); ctx.arc(this.lamp.x,this.lamp.y,2.5*d,0,7); ctx.fill();
    }
    const wind = this.o.wind*d, n = Math.floor(this.drops.length*this.amt), al = this.o.alpha||1;
    ctx.lineCap = 'round';
    for (let i=0;i<n;i++){
      const p = this.drops[i];
      if (!frozen){ p.y += p.v*dt; p.x += wind*p.z*dt*.6; if (p.y - p.l > this.h) Object.assign(p, this.newDrop(false)); }
      const dx = wind*p.z*p.l/p.v*.9;
      ctx.strokeStyle = `rgba(196,212,222,${p.a*al})`; ctx.lineWidth = p.lw;
      ctx.beginPath(); ctx.moveTo(p.x - dx, p.y - p.l); ctx.lineTo(p.x, p.y); ctx.stroke();
    }
    if (this.o.glass){
      for (const q of this.glass){
        if (!frozen){
          if (q.hold > 0) q.hold -= dt*16;
          else { q.v = Math.min(q.v + .08*dt, 2.4*d); q.y += q.v*dt; q.x += (Math.random()-.5)*.6*d; }
          if (q.y > this.h + 10*d){ Object.assign(q, this.newGlass(false)); }
        }
        if (q.v > .3){ ctx.strokeStyle = 'rgba(160,185,195,.12)'; ctx.lineWidth = q.r*.8; ctx.beginPath(); ctx.moveTo(q.x,q.y-q.r*6); ctx.lineTo(q.x,q.y); ctx.stroke(); }
        ctx.fillStyle = 'rgba(170,195,205,.22)'; ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,7); ctx.fill();
        ctx.fillStyle = 'rgba(230,240,240,.28)'; ctx.beginPath(); ctx.arc(q.x-q.r*.3,q.y-q.r*.35,q.r*.35,0,7); ctx.fill();
      }
    }
    if (this.flash > 0){ ctx.fillStyle = `rgba(200,214,232,${this.flash*.55})`; ctx.fillRect(0,0,this.w,this.h); this.flash = Math.max(0, this.flash - .045*dt); }
  }
}

/* =========================================================
   CCTV (Canvas)
   ========================================================= */
const Cctv = {
  c:null, ctx:null, staticT:0, last:0,
  attach(c){ this.c = c; this.ctx = c ? c.getContext('2d') : null; this.resize(); },
  resize(){ if (!this.c) return; const r = this.c.getBoundingClientRect(); this.w = this.c.width = Math.max(1,Math.floor(r.width)); this.h = this.c.height = Math.max(1,Math.floor(r.height)); },
  draw(now, frozen){
    if (!this.ctx || !this.w) return;
    if (now - this.last < 80) return; this.last = now;
    // 사진(CCTV실.png) 위에 노이즈·스캔라인·REC·실시간 시각을 덧그린다
    const ctx = this.ctx, W = this.w, H = this.h;
    ctx.clearRect(0,0,W,H);
    const feeds = [[.028,.088],[.508,.088],[.028,.532],[.508,.532]], fw = .467*W, fh = .422*H;
    const sec = String(Math.floor(now/1000)%60).padStart(2,'0');
    const date = state.chapter>=2 && state.loc==='cctv' && state.mode==='dialog' && state.lastScene && state.lastScene.indexOf('ch2_')===0 ? '2023-11-17' : '2026-11-2' + (state.chapter===1?'3':state.chapter===2?'4':'5');
    const heavy = this.staticT > now, fs = Math.max(9, Math.round(H*.026));
    feeds.forEach(([fx,fy],i)=>{
      const x = fx*W, y = fy*H;
      ctx.save(); ctx.beginPath(); ctx.rect(x,y,fw,fh); ctx.clip();
      if (heavy){ ctx.fillStyle = 'rgba(110,120,115,.55)'; ctx.fillRect(x,y,fw,fh); }
      const cnt = heavy ? 1600 : 140;
      for (let k=0;k<cnt;k++){ ctx.fillStyle = `rgba(220,235,225,${Math.random()*(heavy?.6:.14)})`; ctx.fillRect(x+Math.random()*fw, y+Math.random()*fh, heavy?3:2, 1); }
      ctx.fillStyle = 'rgba(0,0,0,.18)'; for (let yy=y; yy<y+fh; yy+=3) ctx.fillRect(x,yy,fw,1);
      const band = (now/12 + i*60) % (fh+40) - 20; ctx.fillStyle = 'rgba(200,230,210,.05)'; ctx.fillRect(x,y+band,fw,fh*.05);
      // 사진에 찍힌 시각을 가리고 현재 게임 시각 표시
      const tx = x + .008*W, ty = y + fh - .062*H;
      ctx.fillStyle = 'rgba(16,21,20,.96)'; ctx.fillRect(tx, ty, .148*W, .05*H);
      ctx.font = `${fs}px Consolas, monospace`; ctx.fillStyle = 'rgba(225,238,228,.9)';
      ctx.fillText(`${date} ${state.time||'00:00'}:${sec}`, tx + .004*W, ty + .036*H);
      if (Math.floor(now/600)%2===0){
        ctx.fillStyle = '#d33'; ctx.beginPath(); ctx.arc(x+fw-.055*W, y+.035*H, fs*.32, 0, 7); ctx.fill();
        ctx.fillStyle = 'rgba(225,238,228,.9)'; ctx.fillText('REC', x+fw-.045*W, y+.035*H+fs*.35);
      }
      ctx.restore();
    });
  }
};

const bgRain = new Rain({bg:true, density:2400, len:1.2, speed:1.1, wind:1.6});
const winRain = new Rain({density:700, len:1, speed:1, wind:2, scenery:true});
const photoRain = new Rain({density:650, len:.85, speed:1, wind:1.2, alpha:.85});
let frozen = false, lastFrame = performance.now(), nextLightning = performance.now() + 20000 + Math.random()*20000;

function loop(now){
  const dt = Math.min(3, (now - lastFrame)/16.67); lastFrame = now;
  bgRain.draw(dt, frozen);
  if (winRain.c && winRain.c.isConnected) winRain.draw(dt, frozen);
  if (photoRain.c && photoRain.c.isConnected) photoRain.draw(dt, frozen);
  if (Cctv.c && Cctv.c.isConnected) Cctv.draw(now, frozen);
  if (now > nextLightning){
    nextLightning = now + 25000 + Math.random()*30000;
    if (!frozen && state.mode!=='title' && state.loc!=='basement' && state.chapter < 5) lightning();
  }
  requestAnimationFrame(loop);
}
function lightning(){
  const f = $('#flash');
  if (!reduceMotion){
    f.style.transition = 'none'; f.style.opacity = state.loc==='cctv' ? '.04' : '.16';
    setTimeout(()=>{ f.style.transition = 'opacity .9s'; f.style.opacity = '0'; }, 70);
  }
  winRain.flash = 1; photoRain.flash = .8; bgRain.flash = .6;
  setTimeout(()=>Snd.thunder(), 900 + Math.random()*1600);
}

let runner = null, typing = null, busy = false, choicesOpen = false;
const SPK = {n:{name:'',cls:''}, me:{name:'나',cls:'sp-me'}, kang:{name:'강태식',cls:'sp-kang'}, sys:{name:'기록',cls:'sp-sys'}, det:{name:'형사',cls:'sp-det'}};

function playScene(id){
  const sc = SCENES[id];
  if (!sc){ console.error('존재하지 않는 장면:', id); enterExplore(); return; }
  stopTyping(); busy = false; choicesOpen = false;
  state.mode = 'dialog'; state.lastScene = id;
  $('#dlgChoices').innerHTML = '';
  $('#dialog').classList.remove('explore');
  const lines = typeof sc.lines === 'function' ? sc.lines() : sc.lines;
  runner = {id, sc, lines, i:0};
  // 강태식이 나오지 않는 장면이 시작되면 초상을 내린다
  if (!lines.some(L=>Array.isArray(L) && L[0]==='kang')) hidePortrait();
  document.body.classList.add('locked-ui'); closeDrawer();
  next();
}
function next(){
  if (!runner || busy) return;
  while (runner.i < runner.lines.length){
    const L = runner.lines[runner.i++];
    if (typeof L === 'string' && L[0]==='@'){
      const r = runCommand(L) || {};
      if (r.stop) return;
      if (r.wait){ busy = true; $('#dlgNext').hidden = true; later(()=>{ busy = false; next(); }, r.wait); return; }
      continue;
    }
    showLine(L); return;
  }
  finishScene();
}
function showLine(L){
  const [sp, text, opt] = L, S = SPK[sp] || SPK.n;
  const nm = $('#dlgName'), tx = $('#dlgText');
  nm.textContent = S.name; nm.className = S.cls;
  tx.className = 't-' + sp;
  updatePortrait(sp);
  const onPhone = sp==='kang' && runner && PHONE_SCENE.test(runner.id);
  if (onPhone) Snd.voice(text); else Snd.voiceStop();
  state.log.push({sp, text});
  if (state.log.length > 400) state.log.shift();
  $('#dlgNext').hidden = true;
  typeText(tx, text, onPhone, ()=>{
    $('#dlgNext').hidden = false;
    if (opt && opt.glitch){
      busy = true;
      later(()=>{ tx.textContent = opt.glitch; tx.classList.add('glitch'); Snd.staticBurst(); flick(true);
        later(()=>{ tx.textContent = text; tx.classList.remove('glitch'); busy = false; }, 420); }, 650);
    }
  });
}
function typeText(el, text, quiet, done){   // quiet: 전화 목소리가 나오는 동안은 타자 소리를 내지 않는다
  stopTyping(); el.textContent = ''; let i = 0;
  const speed = 22;
  typing = {el, text, done, timer:setInterval(()=>{
    i += 1; el.textContent = text.slice(0, i);
    if (!quiet && i % 2 && /[^\s.,…·“”‘’'"!?—-]/.test(text[i-1])) Snd.key();   // 글자 두 개마다 타자 소리
    if (i >= text.length){ const d = typing.done; stopTyping(); d && d(); }
  }, speed)};
}
function stopTyping(){ if (typing){ clearInterval(typing.timer); typing = null; } }
function finishTyping(){ if (!typing) return; const t = typing; stopTyping(); t.el.textContent = t.text; t.done && t.done(); }

function finishScene(){
  const sc = runner.sc, id = runner.id;
  if (sc.choices){ showChoices(id); return; }
  if (sc.ret){ showChoices(sc.ret); return; }
  if (sc.present !== undefined){ showPresent(sc.present); return; }
  if (sc.next){ playScene(sc.next); return; }

/* 명령 */
function runCommand(str){
  const sp = str.indexOf(' ');
  const cmd = sp<0 ? str.slice(1) : str.slice(1, sp), arg = sp<0 ? '' : str.slice(sp+1);
  switch (cmd){
    case 'clue': {   // 사진이 있는 단서는 창을 닫을 때까지 대사를 멈춘다
      const isNew = !has(arg); addClue(arg);
      if (!isNew || !CLUE_IMG[arg]) return;
      busy = true; $('#dlgNext').hidden = true;
      revealClue(arg, ()=>{ busy = false; next(); });
      return {stop:true};
    }
    case 'flag': state.flags[arg] = true; return;
    case 'time': state.time = arg; renderTop(); return;
    case 'day': state.day = arg; renderTop(); return;
    case 'goto': state.loc = arg; Snd.setLoc(arg); renderView(); document.body.classList.add('locked-ui'); return;
    case 'fx': return fx(arg);
    case 'silence': silence(+arg); return {wait:+arg};
    case 'wait': return {wait:+arg};
    case 'ring': return {wait:Snd.ring(+arg)};
    case 'hangup': Snd.hangup(); return {wait:1600};
    case 'print': printOut(arg); return {wait:3300};
    case 'chapter': return setChapter(+arg);
    case 'status': showStamp(); return {wait:3000};
    case 'rain': setRain(arg); return;
    case 'summary': showSummary(); return {stop:true};
    case 'reclaim': playScene('ch4_c' + state.confront); return {stop:true};
    case 'save': save(); return;
    case 'portrait': if (arg==='off') hidePortrait(); return;
    case 'dayfade': {   // '@dayfade DAY 2|11월 24일 (화)' — 암전이 끝날 때까지 기다린다
      const [num, sub] = arg.split('|');
      $('#dayNum').textContent = num || ''; $('#daySub').textContent = sub || '';
      const d = $('#dayCard'); d.classList.add('show'); requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add('vis')));
      hidePortrait();
      return {wait:1000};
    }
    case 'dayclear': {  // 카드를 걷어 내고 다음 날 장면을 보여 준다
      const d = $('#dayCard'); d.classList.remove('vis');
      later(()=>d.classList.remove('show'), 950);
      return {wait:950};
    }
    default: console.error('알 수 없는 명령:', str); return;
  }
}
function fx(name){
  if (name==='flicker'){ flick(false); return {wait:700}; }
  if (name==='noise'){ Cctv.staticT = performance.now() + 500; Snd.staticBurst(); return; }
  if (name==='static'){
    Cctv.staticT = performance.now() + 1200; Snd.staticBurst();
    const ab = $('#artBox'); ab.classList.add('static'); later(()=>ab.classList.remove('static'), 1200);
    return {wait:1100};
  }
  return;
}
function flick(soft){
  const a = $('#app'); a.classList.remove('flick','flick-soft'); void a.offsetWidth;
  a.classList.add(soft ? 'flick-soft' : 'flick'); Snd.flick();
  later(()=>a.classList.remove('flick','flick-soft'), 1000);
}
function silence(ms){
  Snd.silence(ms); frozen = true;
  $('#dlgText').textContent = ''; $('#dlgName').textContent = ''; $('#dlgName').className = '';
  later(()=>{ frozen = false; }, ms);
}

function inspect(id, fromPaper){
  if (state.mode!=='explore') return;
  const o = OBJECTS.find(x=>x.id===id); if (!o) return;
  const done = state.inspected.includes(id);
  closeDrawer();
  // 목록에서 프린터를 골라도 종이부터 보여 준다
  if (id==='printer' && !done && !fromPaper && state.receipt){ openReceipt(); return; }
  if (id==='printer'){ state.receiptUnread = false; updatePrinterLed(); }
  if (done && o.clue && has(o.clue)){ openClues(o.clue); return; }
  if (done && o.again){ playScene(o.again); return; }
  if (!done) state.inspected.push(id);
  playScene(o.scene);
}
function gotoLocation(id){
  if (state.mode!=='explore') return;
  if (!locOpen(id)){ toast(locLockMsg(id)); return; }
  if (state.loc===id) return;
  closeDrawer();
  state.loc = id; Snd.setLoc(id);
  if (id==='basement' && !state.flags.b1seen){ renderView(); playScene('b1_enter'); return; }
  enterExplore();
}
function addClue(id){
  if (!CLUES[id]){ console.error('존재하지 않는 단서:', id); return; }
  if (has(id)) return;
  const before = new Set(OBJECTS.filter(o=>o.ch.includes(state.chapter) && (!o.req || has(...o.req))).map(o=>o.id));
  state.clues.push(id);
  const opened = OBJECTS.filter(o=>o.ch.includes(state.chapter) && (!o.req || has(...o.req)) && !before.has(o.id));
  Snd.clue(); renderTop();
  toast(`단서 획득 — ${CLUES[id].title}` + (opened.length ? `  ·  새 조사: ${opened.map(o=>LOCS[o.loc].name).join(', ')}` : ''));
}

let modalOnClose = null;
function openModal(title, html, foot, onClose){

function revealClue(id, then){

  openModal(`단서 발견 — ${id} · ${c.title}`,
    `<div class="cluereveal">${clueImg(id)}<p>${esc(c.where)}</p></div>`,
    [mkBtn('확인', 'tbtn', ()=>closeModal())], then);
}
function openClues(sel, presentMode){
  const got = CLUE_ORDER.filter(id=>has(id));
  let cur = sel || got[got.length-1] || null;
  const draw = ()=>{
    const list = CLUE_ORDER.map(id=>{
      if (!has(id)) return `<div class="ci unk"><small>${id}</small>???</div>`;
      return `<button class="ci${id===cur?' sel':''}" data-id="${id}"><small>${id}</small>${esc(CLUES[id].title)}</button>`;
    }).join('');
    let detail = '<p style="color:var(--faint)">아직 확보한 단서가 없다.</p>';
    if (cur){
      const c = CLUES[cur];
      detail = `<div class="paperbox"><h4>${cur} · ${esc(c.title)}</h4><div class="where">발견 장소: ${esc(c.where)}</div>${clueImg(cur)}<pre>${esc(c.body)}</pre><div class="mean"><b>의미</b> — ${esc(c.mean)}</div></div>`
        + (presentMode ? `<button class="presentbtn" id="presentBtn">이 증거를 제시한다</button>` : '');
    }
    const head = presentMode ? `<p style="margin:0 0 10px;color:#e3b0b0">강태식: “${esc(ROUNDS[state.confront].claim)}”</p>` : '';
    $('#modalBody').innerHTML = head + `<div class="cluegrid"><div class="clist">${list}</div><div class="cdetail">${detail}</div></div>`;
    $('#modalBody').querySelectorAll('.ci[data-id]').forEach(b=>b.addEventListener('click', ()=>{ cur = b.dataset.id; draw(); }));
    const pb = $('#presentBtn'); if (pb) pb.addEventListener('click', ()=>{ const id = cur; closeModal(); present(id); });
  };
  openModal(presentMode ? '증거 제시 — 단서를 고르세요' : `단서 목록 (${got.length}/${CLUE_ORDER.length})`, '', null);
  draw();
}

/* =========================================================
   시작 / 재시작 / 이어하기
   ========================================================= */
function hideOverlays(){
  hidePortrait();
  ['#card','#dayCard','#stamp','#summary','#modal'].forEach(s=>$(s).classList.remove('show','vis'));
  $('#art').querySelectorAll('.printer-led').forEach(e=>e.classList.remove('alert'));
}
/* 시작: 비 내리는 건물 앞에서 1인칭으로 입구까지 걸어 들어간다 */
let walking = false;
function startGame(withSound){
  if (walking) return;
  walking = true;
  if (withSound) Snd.enable(); else Snd.disable();
  Snd.setLoc('outside');
  const t = $('#title');
  // 1) 버튼이 사라지며 화면이 살짝 밝아진다  2) 입구를 향해 걸어 들어간다
  t.classList.add('lit');
  const LIT = 1100, dur = reduceMotion ? 1300 : 4600;
  later(()=>t.classList.add('walking'), LIT);
  if (!reduceMotion){
    [0,620,1240,1840,2420,2980,3500].forEach((ms,i)=>later(()=>Snd.step(i%2), LIT + ms));
    later(()=>{ Snd.door(); Snd.setLoc('security'); }, LIT + 3900);
  }
  later(()=>{ walking = false; beginGame(withSound); }, LIT + dur);
}
function beginGame(withSound){
  clearSave();
  state = createInitialState(); renderedArt = null;
  hideOverlays(); setRain('heavy');
  Snd.setLoc('security');
  state.mode = 'dialog'; renderView();
  // 암전된 입구에서 바로 챕터 카드로 이어지도록, 카드가 뜬 뒤 시작 화면을 걷는다
  setChapter(1);
  later(()=>{ $('#title').classList.remove('show','walking','lit'); document.body.classList.remove('at-title'); }, 700);
  later(()=>playScene('ch1_intro'), 3000);
}
function continueGame(){
  const s = loadSave(); if (!s){ startGame(true); return; }
  state = Object.assign(createInitialState(), s); renderedArt = null;
  if (!Array.isArray(state.inspected)) state.inspected = [];
  if (!Array.isArray(state.asked)) state.asked = [];
  if (!Array.isArray(state.log)) state.log = [];
  if (!state.flags || typeof state.flags!=='object') state.flags = {};
  if (!LOCS[state.loc] || (state.loc==='basement' && !state.flags.key) || LOCS[state.loc].hidden) state.loc = 'security';
  hideOverlays(); setRain('heavy');
  Snd.enable(); Snd.setLoc(state.loc);
  $('#title').classList.remove('show'); document.body.classList.remove('at-title');
  if (state.chapter===4){ state.chapter = 3; renderView(); playScene('ch4_intro'); }
  else enterExplore();
}
function resetGame(){
  clearTimers(); stopTyping(); runner = null; busy = false; choicesOpen = false; frozen = false;
  walking = false; $('#title').classList.remove('walking','lit');
  clearSave();
  state = createInitialState(); renderedArt = null;
  hideOverlays(); setRain('heavy');
  Snd.setLoc('security');
  $('#dlgName').textContent = ''; $('#dlgName').className = ''; $('#dlgText').textContent = ''; $('#dlgChoices').innerHTML = ''; $('#dlgNext').hidden = true;
  renderView();
  $('#btnContinue').hidden = true;
  $('#title').classList.add('show'); document.body.classList.add('at-title');
}

/* =========================================================
   데이터 무결성 검사
   ========================================================= */
function integrityCheck(){
  const err = [];
  OBJECTS.forEach(o=>{
    if (!SCENES[o.scene]) err.push(`조사 대상 ${o.id}: 장면 ${o.scene} 없음`);
    if (o.again && !SCENES[o.again]) err.push(`조사 대상 ${o.id}: 장면 ${o.again} 없음`);
    if (o.clue && !CLUES[o.clue]) err.push(`조사 대상 ${o.id}: 단서 ${o.clue} 없음`);
    (o.req||[]).forEach(r=>{ if (!CLUES[r]) err.push(`조사 대상 ${o.id}: 조건 단서 ${r} 없음`); });
    if (!LOCS[o.loc]) err.push(`조사 대상 ${o.id}: 장소 ${o.loc} 없음`);
  });
  Object.entries(SCENES).forEach(([id,sc])=>{
    ['next','ret'].forEach(k=>{ if (sc[k] && !SCENES[sc[k]]) err.push(`장면 ${id}: ${k} ${sc[k]} 없음`); });
    (sc.choices||[]).forEach(c=>{ if (!SCENES[c.go]) err.push(`장면 ${id}: 선택지 ${c.go} 없음`); });
    if (Array.isArray(sc.lines)) sc.lines.forEach(L=>{
      if (typeof L==='string'){
        if (L.startsWith('@clue ') && !CLUES[L.slice(6)]) err.push(`장면 ${id}: 단서 ${L.slice(6)} 없음`);
        if (L.startsWith('@goto ') && !LOCS[L.slice(6)]) err.push(`장면 ${id}: 장소 ${L.slice(6)} 없음`);
      }
    });
  });
  ROUNDS.forEach((r,i)=>{ if (!SCENES[r.ok]) err.push(`대면 ${i}: 장면 ${r.ok} 없음`); r.accept.forEach(a=>{ if (!CLUES[a]) err.push(`대면 ${i}: 단서 ${a} 없음`); }); });
  Object.values(GOALS).forEach(g=>{ if (g.scene && !SCENES[g.scene]) err.push(`목표 장면 ${g.scene} 없음`); });
  if (err.length) console.error('[무결성 검사] 오류:\n' + err.join('\n'));
  else console.log('[무결성 검사] 통과 — 장면 ' + Object.keys(SCENES).length + '개, 단서 ' + CLUE_ORDER.length + '개');
}

/* =========================================================
   이벤트 연결
   ========================================================= */
$('#dialog').addEventListener('click', onAdvance);
document.addEventListener('keydown', e=>{
  if (e.key==='Escape' && $('#modal').classList.contains('show')){ closeModal(); return; }
  if (e.key==='Escape'){ closeDrawer(); return; }
  if ((e.key===' ' || e.key==='Enter') && state.mode==='dialog' && !choicesOpen && !$('#modal').classList.contains('show')){
    if (document.activeElement && document.activeElement.tagName==='BUTTON' && document.activeElement.id!=='dialog') document.activeElement.blur();
    e.preventDefault(); onAdvance();
  }
});
function proceed(){
  const g = GOALS[state.chapter]; if (!g || !g.need() || state.mode!=='explore') return;
  closeDrawer();
  if (g.action) g.action(); else playScene(g.scene);
}
$('#proceed').addEventListener('click', proceed);
$('#barProceed').addEventListener('click', e=>{ e.stopPropagation(); proceed(); });
$('#btnDrawer').addEventListener('click', e=>{ e.stopPropagation(); toggleDrawer(); });
$('#drawerClose').addEventListener('click', closeDrawer);
$('#stage').addEventListener('click', e=>{ if (!e.target.closest('.printer-hot')) closeDrawer(); });
// 대사 진행 중에는 화면 어디를 눌러도 다음 대사로 넘어간다
$('#stage').addEventListener('click', ()=>{ if (state.mode==='dialog') onAdvance(); });
$('#btnHint').addEventListener('click', openHint);
$('#btnClues').addEventListener('click', ()=>openClues());
$('#btnLog').addEventListener('click', openLog);
$('#btnSound').addEventListener('click', ()=>{ if (Snd.on) Snd.disable(); else if (!Snd.enable()) toast('이 브라우저에서는 소리를 재생할 수 없습니다.'); renderTop(); });
$('#btnReset').addEventListener('click', confirmReset);
$('#modalClose').addEventListener('click', closeModal);
$('#modal').addEventListener('click', e=>{ if (e.target.id==='modal') closeModal(); });
/* 휴대폰: 시작할 때 전체화면 + 세로 고정 (막힌 환경이면 조용히 넘어간다) */
function goPortrait(){
  if (!matchMedia('(pointer:coarse)').matches) return;
  try{
    const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
    const p = req ? req.call(el) : null;
    const lock = ()=>{ try{ const r = screen.orientation && screen.orientation.lock && screen.orientation.lock('portrait'); if (r && r.catch) r.catch(()=>{}); }catch(e){} };
    if (p && p.then) p.then(lock, ()=>{}); else lock();
  }catch(e){}
}
$('#btnStart').addEventListener('click', goPortrait);
$('#btnContinue').addEventListener('click', goPortrait);
$('#btnStart').addEventListener('click', ()=>startGame(true));
// 이어하기: 화면이 살짝 밝아진 뒤 저장된 곳으로 바로 들어간다
$('#btnContinue').addEventListener('click', ()=>{
  if (walking) return; walking = true;
  Snd.enable(); Snd.setLoc('outside');
  $('#title').classList.add('lit');
  later(()=>{ walking = false; $('#title').classList.remove('lit'); continueGame(); }, 1100);
});
// 상단 바 높이를 CSS에 알려 준다 (모바일에서 줄바꿈되면 장면 위치가 맞춰진다)
function syncTopH(){ document.documentElement.style.setProperty('--topH', $('#top').offsetHeight + 'px'); }
function onResize(){ syncTopH(); syncDlgH(); requestAnimationFrame(()=>{ bgRain.resize(); winRain.resize(); photoRain.resize(); Cctv.resize(); }); }
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', ()=>setTimeout(onResize, 250));
if (window.ResizeObserver) new ResizeObserver(syncTopH).observe($('#top'));
// 대사창 높이도 알려 준다 (세로 화면에서 선택지가 뜰 때 장면을 그만큼 줄인다)
function syncDlgH(){ document.documentElement.style.setProperty('--dlgH', $('#dialog').offsetHeight + 'px'); }
if (window.ResizeObserver) new ResizeObserver(syncDlgH).observe($('#dialog'));
syncTopH();
// 탐색 중 가끔 형광등이 흔들린다
setInterval(()=>{ if (state.mode==='explore' && state.loc!=='outside' && Math.random()<.35) flick(true); }, 14000);

/* 초기화 */
integrityCheck();
bgRain.attach($('#bgRain'));
if (loadSave()) $('#btnContinue').hidden = false;
renderView();
requestAnimationFrame(loop);
</script>
