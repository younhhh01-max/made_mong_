<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2d2b6b">
<title>몽이의 눈덩이 굴리기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#1c1a33;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  #app{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;
    background:linear-gradient(#2d2b6b,#8a5ea8 55%,#f6a58f)}
  #app canvas{display:block;width:100%;height:100%}
  .hidden{display:none!important}

  /* ---------- HUD ---------- */
  #hud{position:absolute;left:0;right:0;top:0;z-index:5;pointer-events:none;
    padding:calc(env(safe-area-inset-top) + .8em) 1em 0;display:flex;flex-direction:column;align-items:center;
    opacity:0;transition:opacity .5s}
  #hud.on{opacity:1}
  #prog{position:relative;width:74%;height:.85em;border-radius:1em;background:rgba(255,255,255,.28);
    border:.15em solid rgba(255,255,255,.9);box-shadow:0 .2em .6em rgba(40,30,90,.25)}
  #progFill{height:100%;width:0;border-radius:1em;background:linear-gradient(90deg,#9fdcff,#ffffff)}
  #progMong{position:absolute;top:50%;left:0;transform:translate(-50%,-55%);font-size:1.35em;
    filter:drop-shadow(0 .1em .1em rgba(0,0,0,.25))}
  #progEnd{position:absolute;right:-.9em;top:50%;transform:translateY(-58%);font-size:1.5em}
  #weight{margin-top:.15em;color:#fff;line-height:1;white-space:nowrap;
    text-shadow:0 .07em 0 #3a64b4,0 .14em 0 #2c4c8c,0 0 .4em rgba(120,170,255,.55)}
  #wNum{font-size:4.2em;display:inline-block}
  #wUnit{font-size:1.9em;margin-left:.08em}
  #wBox{display:inline-block;transform-origin:50% 60%}

  #popups{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
  .pop{position:absolute;left:50%;top:34%;font-size:3.4em;color:#fff;white-space:nowrap;
    transform:translate(-50%,0);animation:popUp 1.05s ease-out forwards}
  .pop.good{-webkit-text-stroke:.07em #2563c9;paint-order:stroke fill;text-shadow:0 .09em 0 #1d4d9c,0 0 .45em rgba(80,160,255,.9)}
  .pop.bad{-webkit-text-stroke:.07em #d23a55;paint-order:stroke fill;text-shadow:0 .09em 0 #9a1f34,0 0 .45em rgba(255,90,110,.9)}
  .pop.step{top:40%;font-size:3em}
  @keyframes popUp{
    0%{opacity:0;transform:translate(-50%,.6em) scale(.4)}
    18%{opacity:1;transform:translate(-50%,0) scale(1.25)}
    32%{transform:translate(-50%,0) scale(1)}
    70%{opacity:1;transform:translate(-50%,-1.2em) scale(1)}
    100%{opacity:0;transform:translate(-50%,-2.4em) scale(1)}}

  /* ---------- screens ---------- */
  .screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center}
  #title{justify-content:space-between;padding:calc(env(safe-area-inset-top) + 2.2em) 0 calc(env(safe-area-inset-bottom) + 2.4em);
    box-sizing:border-box;background:linear-gradient(rgba(30,26,80,.55),rgba(30,26,80,0) 45%,rgba(30,26,80,0) 70%,rgba(30,26,80,.45))}
  .tLogo{text-align:center;color:#fff;line-height:1.05;animation:floaty 3s ease-in-out infinite}
  .tSmall{font-size:2.3em;color:#ffe08a;text-shadow:0 .08em 0 #c4652b}
  .tBig{font-size:3.5em;text-shadow:0 .07em 0 #3a64b4,0 .14em 0 #24407a,0 0 .5em rgba(150,190,255,.6)}
  .tSnow{font-size:1.4em;letter-spacing:.3em;margin-top:.25em}
  #tapStart{font-size:1.9em;color:#fff;text-shadow:0 .08em 0 rgba(40,30,90,.6);animation:blink 1.2s ease-in-out infinite}
  #tBest{font-size:1.15em;color:#fff3c8;margin-top:.5em;text-align:center;opacity:.95}
  @keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.96)}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-.25em)}}

  #result{justify-content:center;background:rgba(28,24,70,.45);opacity:0;transition:opacity .4s}
  #result.show{opacity:1}
  .card{width:78%;background:linear-gradient(#ffffff,#eef3ff);border-radius:1.6em;padding:1.4em 1em 1.3em;text-align:center;
    box-shadow:0 .5em 0 #b9c6ea,0 1.2em 2.2em rgba(20,10,60,.45);transform:scale(.6);transition:transform .45s cubic-bezier(.2,1.6,.4,1)}
  #result.show .card{transform:scale(1)}
  .rHead{font-size:1.7em;color:#d94a5c}
  .rLabel{font-size:1.25em;color:#6b6f92;margin-top:.6em}
  .rWeight{font-size:3.6em;color:#2f6fd6;line-height:1.05;text-shadow:0 .06em 0 #cfe0ff}
  .rRow{display:flex;justify-content:space-around;margin-top:.8em;font-size:1.15em;color:#55597a}
  .rRow b{display:block;font-weight:normal;font-size:1.6em;color:#3b3f66}
  #rNew{display:inline-block;margin-left:.3em;padding:.05em .45em;border-radius:1em;background:#ff5b74;color:#fff;font-size:.75em;vertical-align:middle;
    animation:blink .8s infinite}
  #retry{margin-top:1.1em;font:inherit;font-size:1.7em;color:#fff;background:linear-gradient(#5fb2ff,#3a82e8);border:none;border-radius:1em;
    padding:.35em 1.6em;box-shadow:0 .2em 0 #2a5fae;cursor:pointer}
  #retry:active{transform:translateY(.12em);box-shadow:0 .08em 0 #2a5fae}
  #mute{position:absolute;right:calc(env(safe-area-inset-right) + .6em);top:calc(env(safe-area-inset-top) + 2.6em);z-index:12;
    width:2.3em;height:2.3em;border-radius:50%;border:.12em solid rgba(255,255,255,.85);background:rgba(40,34,100,.35);
    color:#fff;font-size:1.05em;line-height:1;padding:0;cursor:pointer}
  #loadMsg{position:absolute;bottom:22%;left:0;right:0;text-align:center;color:#fff;font-size:1.1em;opacity:.85;z-index:11}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="prog"><div id="progFill"></div><div id="progMong">🐵</div><div id="progEnd">🎄</div></div>
    <div id="weight"><span id="wBox"><span id="wNum">1.0</span><span id="wUnit">kg</span></span></div>
  </div>
  <div id="popups"></div>
  <div id="title" class="screen">
    <div class="tLogo">
      <div class="tSmall">몽이의</div>
      <div class="tBig">눈덩이 굴리기</div>
      <div class="tSnow">❄ ❄ ❄</div>
    </div>
    <div>
      <div id="tapStart">터치해서 시작</div>
      <div id="tBest"></div>
    </div>
  </div>
  <div id="result" class="screen hidden">
    <div class="card">
      <div class="rHead" id="rHead">도착!</div>
      <div class="rLabel">최종 무게</div>
      <div class="rWeight" id="rWeight">0kg</div>
      <div class="rRow">
        <div>계단<b id="rSteps">0 / 6칸</b></div>
        <div>최고 기록<span id="rNew" class="hidden">NEW</span><b id="rBest">0kg</b></div>
      </div>
      <button id="retry">다시 하기</button>
    </div>
  </div>
  <button id="mute" aria-label="배경음악 켜기/끄기">🔊</button>
  <div id="loadMsg">불러오는 중...</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script>
  setTimeout(function(){ if(!window.__ready){ var m=document.getElementById('loadMsg'); if(m) m.textContent='불러오는 중... (인터넷 연결이 필요해요)'; } }, 5000);
</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

// =====================================================================
//  설정값 (밸런스 조절은 여기서)
// =====================================================================
const CFG = {
  SPEED: 12,          // 전진 속도 (유닛/초)
  RUN_TIME: 30,       // 계단까지 걸리는 시간(초)
  ROAD_W: 9,          // 길 폭
  FIRST_GATE: 40, GATE_SPACING: 45,
  GROW_BASE: 0.35, GROW_RATE: 0.015,   // 초당 증가량 = BASE + 무게*RATE
  ROCK_LOSS: 0.2,     // 돌 충돌 시 20% 감소
  STEPS: 6, STEP_D: 5, STEP_H: 1.1,
  STEP_COST: 5,      // 계단 한 칸당 깎이는 무게(kg)
  STAIR_SPEED: 7,
  MIN_RUN_W: 1,       // 달리는 중 최소 무게
};
const COURSE = CFG.SPEED * CFG.RUN_TIME;
const STAIR_Z0 = -COURSE;                                    // 첫 계단 턱
const LAST_STEP_Z = STAIR_Z0 - CFG.STEP_D * (CFG.STEPS - 1);
const TOP_LEN = 22;
const TOP_Y = CFG.STEPS * CFG.STEP_H;
const TREE_Z = LAST_STEP_Z - 13;
const STOP_Z = TREE_Z + 9;
const BEST_KEY = 'mong_snowball_best_v1';

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const damp = (k, dt) => 1 - Math.exp(-k * dt);
const pick = a => a[Math.floor(Math.random() * a.length)];
const radiusOf = w => w <= 0 ? 0 : Math.min(4, 0.35 + 0.32 * Math.cbrt(w));
const fmt = w => (w <= 0 ? '0' : w < 10 ? (Math.floor(w * 10) / 10).toFixed(1) : String(Math.floor(w)));
function groundH(z) {
  if (z > STAIR_Z0 || z < LAST_STEP_Z - TOP_LEN) return 0;
  const i = Math.min(CFG.STEPS - 1, Math.floor((STAIR_Z0 - z) / CFG.STEP_D));
  return (i + 1) * CFG.STEP_H;
}

// =====================================================================
//  화면 / 렌더러
// =====================================================================
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
let pixelRatio = Math.min(window.devicePixelRatio || 1, 1.75);
renderer.setPixelRatio(pixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
app.prepend(renderer.domElement);

const scene = new THREE.Scene();
const FOG_COL = 0xf2bcae;
scene.fog = new THREE.Fog(FOG_COL, 35, 125);
const camera = new THREE.PerspectiveCamera(55, 9 / 16, 0.1, 600);

let W = 360, H = 640;
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  if (vw / vh > 9 / 16) { H = vh; W = Math.round(vh * 9 / 16); } else { W = vw; H = vh; }
  app.style.width = W + 'px'; app.style.height = H + 'px';
  app.style.fontSize = (W / 400 * 16) + 'px';
  renderer.setSize(W, H, false);
  camera.aspect = W / H; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ---------- 하늘 (해 질 녘 그라데이션) ----------
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(450, 24, 12),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      top: { value: new THREE.Color('#2b2a6e') }, mid: { value: new THREE.Color('#9a63a8') },
      low: { value: new THREE.Color('#f58f86') }, hor: { value: new THREE.Color('#ffd2a6') },
      sunDir: { value: new THREE.Vector3(-0.35, 0.12, -1).normalize() },
    },
    vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `uniform vec3 top,mid,low,hor,sunDir; varying vec3 vDir;
      void main(){ float h = vDir.y;
        vec3 c = mix(hor, low, smoothstep(-0.02, 0.10, h));
        c = mix(c, mid, smoothstep(0.10, 0.32, h));
        c = mix(c, top, smoothstep(0.32, 0.75, h));
        float s = max(dot(normalize(vDir), sunDir), 0.0);
        c += vec3(1.0,0.78,0.5) * (pow(s, 60.0)*0.9 + pow(s, 8.0)*0.25);
        gl_FragColor = vec4(c, 1.0); }`,
  })
);
sky.material.uniforms.top.value.convertLinearToSRGB();
sky.material.uniforms.mid.value.convertLinearToSRGB();
sky.material.uniforms.low.value.convertLinearToSRGB();
sky.material.uniforms.hor.value.convertLinearToSRGB();
sky.renderOrder = -1;
scene.add(sky);

// ---------- 조명 ----------
const hemi = new THREE.HemisphereLight(0xdfe2ff, 0xffe4d8, 1.55);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffc896, 2.0);
const SUN_OFF = new THREE.Vector3(-6, 18, -9);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 18, bottom: -16, near: 1, far: 70 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

// ---------- 텍스처 유틸 ----------
function radialTex(stops, size = 64) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  stops.forEach(([o, col]) => gr.addColorStop(o, col));
  g.fillStyle = gr; g.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const glowTex = radialTex([[0, 'rgba(255,255,255,1)'], [0.25, 'rgba(255,255,255,.55)'], [1, 'rgba(255,255,255,0)']]);
const flakeTex = radialTex([[0, 'rgba(255,255,255,1)'], [0.45, 'rgba(255,255,255,.9)'], [1, 'rgba(255,255,255,0)']], 32);

// =====================================================================
//  정적 배경 (하나로 합쳐서 드로우콜 최소화)
// =====================================================================
const G = {
  cyl: new THREE.CylinderGeometry(1, 1, 1, 7),
  cone: new THREE.ConeGeometry(1, 1, 7),
  box: new THREE.BoxGeometry(1, 1, 1),
  sph: new THREE.SphereGeometry(1, 8, 5),
  ico: new THREE.IcosahedronGeometry(1, 0),
  hook: new THREE.TorusGeometry(1, 0.4, 5, 8, Math.PI),
  circle: new THREE.CircleGeometry(1, 12).rotateX(-Math.PI / 2),
};
const decorParts = [], shadowParts = [];
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _v = new THREE.Vector3(), _s = new THREE.Vector3(), _c = new THREE.Color();
function add(geo, color, x, y, z, sx = 1, sy = sx, sz = sx, rx = 0, ry = 0, rz = 0) {
  const g = geo.index ? geo.toNonIndexed() : geo.clone();
  if (g.attributes.uv) g.deleteAttribute('uv');
  _q.setFromEuler(_e.set(rx, ry, rz)); _m4.compose(_v.set(x, y, z), _q, _s.set(sx, sy, sz));
  g.applyMatrix4(_m4);
  _c.set(color);
  const n = g.attributes.position.count, arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { arr[i * 3] = _c.r; arr[i * 3 + 1] = _c.g; arr[i * 3 + 2] = _c.b; }
  g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  decorParts.push(g);
}
function addShadow(x, z, r, y = 0) {
  const g = G.circle.index ? G.circle.toNonIndexed() : G.circle.clone();
  g.deleteAttribute('uv');
  g.applyMatrix4(_m4.compose(_v.set(x, y + 0.03, z), _q.identity(), _s.set(r, 1, r)));
  shadowParts.push(g);
}

// 반짝이 전구 (3색 그룹, 그룹별로 깜빡임)
const BULB_COLS = [0xffd36b, 0xff4f62, 0x74b8ff];
const bulbs = [[], [], []];
function addBulb(x, y, z, s = 1, g) { bulbs[g ?? (Math.random() * 3 | 0)].push(x, y, z, s); }

const TIERS = [[1.4, 1.5, 1.15], [1.08, 1.3, 1.95], [0.75, 1.1, 2.65]]; // 반지름, 높이, 중심y
function treeR(y) {
  let m = 0;
  for (const [r, h, cy] of TIERS) { const l = (y - (cy - h / 2)) / h; if (l >= 0 && l <= 1) m = Math.max(m, r * (1 - l)); }
  return m;
}
function tree(x, z, s, by = 0, lights = true, nBulbs = 14) {
  add(G.cyl, 0x7a4a2e, x, by + 0.3 * s, z, 0.2 * s, 0.6 * s, 0.2 * s);
  const greens = [0x2c744b, 0x358a57, 0x41a366];
  TIERS.forEach(([r, h, cy], i) => {
    const ry = rand(0, 6);
    add(G.cone, greens[i], x, by + cy * s, z, r * s, h * s, r * s, 0, ry, 0);
    add(G.cone, 0xf3f6ff, x, by + (cy + h * 0.3) * s, z, r * 0.56 * s, h * 0.42 * s, r * 0.56 * s, 0, ry + 0.4, 0);
  });
  add(G.ico, 0xffd34d, x, by + 3.32 * s, z, 0.17 * s);
  addShadow(x, z, 1.5 * s, by);
  if (!lights) return;
  const off = rand(0, 6);
  for (let k = 0; k < nBulbs; k++) {
    const t = (k + 0.5) / nBulbs, y = 0.5 + t * 2.55, a = off + t * Math.PI * 2 * 3.2;
    const R = treeR(y) + 0.06;
    addBulb(x + Math.cos(a) * R * s, by + y * s, z + Math.sin(a) * R * s, Math.min(s, 1.7), k % 3);
  }
}
const GIFT_COLS = [[0xff5b6e, 0xfff1b8], [0x4aa3ff, 0xffffff], [0x6fd08c, 0xff5b6e], [0xffc93c, 0x4aa3ff], [0xb98cff, 0xfff1b8]];
function gift(x, z, s, by = 0) {
  const [col, rib] = pick(GIFT_COLS), ry = rand(0, Math.PI);
  add(G.box, col, x, by + s / 2, z, s, s, s, 0, ry, 0);
  add(G.box, rib, x, by + s / 2, z, s * 1.04, s * 1.04, s * 0.2, 0, ry, 0);
  add(G.box, rib, x, by + s / 2, z, s * 0.2, s * 1.04, s * 1.04, 0, ry, 0);
  const dx = Math.cos(ry) * 0.14 * s, dz = -Math.sin(ry) * 0.14 * s;
  add(G.sph, rib, x + dx, by + s * 1.06, z + dz, s * 0.17, s * 0.13, s * 0.1, 0, ry, 0.5);
  add(G.sph, rib, x - dx, by + s * 1.06, z - dz, s * 0.17, s * 0.13, s * 0.1, 0, ry, -0.5);
  addShadow(x, z, s * 0.85, by);
}
function cane(x, z, by = 0, s = 1) {
  for (let i = 0; i < 5; i++) add(G.cyl, i % 2 ? 0xffffff : 0xe8384f, x, by + (0.11 + i * 0.22) * s, z, 0.07 * s, 0.22 * s, 0.07 * s);
  add(G.hook, 0xe8384f, x, by + 1.1 * s, z + 0.17 * s, 0.17 * s, 0.17 * s, 0.17 * s, 0, Math.PI / 2, 0);
  add(G.sph, 0xffffff, x, by + 1.25 * s, z + 0.17 * s, 0.05 * s);
}

function buildWorld() {
  const RW = CFG.ROAD_W, half = RW / 2;
  // 바닥
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(260, COURSE + 300).rotateX(-Math.PI / 2),
    new THREE.MeshStandardMaterial({ color: 0xfbfbff, roughness: 1 }));
  ground.position.z = -COURSE / 2 - 40; ground.receiveShadow = true; scene.add(ground);
  const road = new THREE.Mesh(new THREE.PlaneGeometry(RW, COURSE + 40).rotateX(-Math.PI / 2),
    new THREE.MeshStandardMaterial({ color: 0xd6e2fb, roughness: 1 }));
  road.position.set(0, 0.01, -COURSE / 2 + 10); road.receiveShadow = true; scene.add(road);

  // 길 양옆 눈 둑 + 지팡이 사탕 울타리
  for (let z = 22; z > STAIR_Z0 + 1; z -= 3.6) {
    for (const s of [-1, 1]) add(G.sph, 0xffffff, s * (half + 0.4), 0, z + rand(-.4, .4), rand(.5, .65), rand(.18, .26), rand(2.1, 2.5));
  }
  for (let z = 20; z > STAIR_Z0 + 2; z -= 3) for (const s of [-1, 1]) cane(s * (half + 0.95), z);

  // 트리, 선물, 눈 언덕
  for (let z = 30; z > LAST_STEP_Z - TOP_LEN - 40; z -= rand(7.5, 10.5)) {
    for (const s of [-1, 1]) {
      const nearStairs = z < STAIR_Z0 + 3;
      const bx = nearStairs ? half + 6.5 : half + 2.8;
      const tx = s * (bx + rand(0, 2.5)), tz = z + rand(-2, 2);
      tree(tx, tz, rand(0.95, 1.35));

  SFX.click();
  const r = $('result'); r.classList.remove('show');
  setTimeout(() => r.classList.add('hidden'), 300);
  resetGame('run'); S.mRotY = 0; hud.classList.add('on'); bgmStart();
}

// =====================================================================
//  업데이트
// =====================================================================
function updateRun(dt) {
  S.speed += (CFG.SPEED - S.speed) * damp(2, dt);
  S.z -= S.speed * dt;
  // 눈길 위에서 계속 커짐
  S.w += (CFG.GROW_BASE + S.w * CFG.GROW_RATE) * dt;
  // 좌우 이동
  if (keys.l) S.targetX -= 10 * dt;
  if (keys.r) S.targetX += 10 * dt;
  const lim = Math.max(0, CFG.ROAD_W / 2 - S.rVis * 0.5);
  S.targetX = clamp(S.targetX, -lim, lim);
  S.x += (S.targetX - S.x) * damp(6.5, dt);

  // 게이트
  for (const g of gates) {
    if (g.done || S.z > g.z) continue;
    g.done = true;
    const side = g.sides[S.x < 0 ? 0 : 1], other = g.sides[S.x < 0 ? 1 : 0];
    const nw = Math.max(CFG.MIN_RUN_W, side.f(S.w));
    const delta = nw - S.w;
    setWeight(nw);
    popup(side.t.replace('-', '−') + (side.t.startsWith('×') || side.t.startsWith('÷') ? '' : 'kg'), side.good ? 'good' : 'bad');
    bigPop(side.good);
    side.good ? SFX.good() : SFX.bad();
    const col = side.good ? 0x7cc0ff : 0xff7b8d;
    burst(side.panel.position.x, 2, g.z, 26, { spread: 3, up: 7, size: [0.07, 0.16], life: [0.6, 1.1], colors: [col, 0xffffff, side.good ? 0xffe27a : 0xffb3bf], grav: -9 });
    tween(0.6, k => {
      side.pmat.opacity = k < 0.2 ? 0.38 + k * 3 : 0.98 * (1 - (k - 0.2) / 0.8);
      side.label.scale.setScalar(1 + Math.sin(Math.min(1, k * 2) * Math.PI) * 0.45);
      side.label.position.y = 4 + k * 1.6; side.lmat.opacity = 1 - k * k;
      other.pmat.opacity = 0.38 * (1 - k); other.lmat.opacity = 1 - k;
      other.bmat.opacity = 1 - k;
    });
    if (delta < 0) S.shake = Math.max(S.shake, 0.15);
  }
  // 돌멩이
  for (const r of rocks) {
    if (r.hit) continue;
    if (Math.abs(S.z - r.z) < S.rVis * 0.75 + r.r && Math.abs(S.x - r.x) < S.rVis * 0.8 + r.r * 0.8) {
      r.hit = true;
      setWeight(Math.max(CFG.MIN_RUN_W, S.w * (1 - CFG.ROCK_LOSS)));
      popup('−20%', 'bad'); bigPop(false); SFX.rock();
      S.shake = 0.55; S.speed = CFG.SPEED * 0.55;
      try { navigator.vibrate && navigator.vibrate(60); } catch (e) {}
      burst(S.x, S.y, S.z - S.rVis * 0.8, 24, { spread: 4, up: 7, size: [0.07, 0.18], life: [0.7, 1.3] });
      const dir = r.x > S.x ? 1 : -1, g = r.grp;
      tween(0.7, k => {
        g.position.x = r.x + dir * k * 5; g.position.y = Math.sin(k * Math.PI) * 1.6; g.position.z = r.z - k * 3;
        g.rotation.z = -dir * k * 6; g.scale.setScalar(1 - k * 0.6);
      }, () => { g.visible = false; });
    }
  }
  // 눈 자국 + 눈가루
  S.trailAcc += S.speed * dt;
  while (S.trailAcc > 0.35) { S.trailAcc -= 0.35; addTrail(S.x, S.z + S.rVis * 0.3, S.rVis); }
  S.puffT -= dt;
  if (S.puffT < 0) {
    S.puffT = 0.05;
    const sx = Math.random() < 0.5 ? -1 : 1;
    spawn(S.x + sx * S.rVis * 0.6, 0.1, S.z + S.rVis * 0.2, sx * rand(0.5, 1.5), rand(1.5, 3), rand(1, 3), rand(0.04, 0.1), rand(0.4, 0.7), 0xffffff, -8);
  }
  if (S.z < STAIR_Z0 + 13) S.phase = 'stairs';
}

function updateStairs(dt) {
  S.speed += (CFG.STAIR_SPEED - S.speed) * damp(2, dt);
  S.targetX = 0; S.x += (0 - S.x) * damp(3, dt);
  S.z -= S.speed * dt;
  const i = S.stepsDone;
  if (i < CFG.STEPS) {
    const riser = STAIR_Z0 - i * CFG.STEP_D;
    if (S.z - S.rVis * 0.8 <= riser) {
      const nw = S.w - CFG.STEP_COST;
      if (nw <= 0) {
        // 다 녹아버림 → 그 칸에서 멈춤
        S.z = riser + S.rVis * 0.8;
        setWeight(0); S.ballGone = true;
        burst(S.x, S.y, S.z, 40, { spread: 4.5, up: 6, size: [0.06, 0.18], life: [0.8, 1.4], grav: -6 });
        popup('−' + CFG.STEP_COST + 'kg', 'bad step'); bigPop(false); SFX.fail(); bgmDuck(2.5);
        S.phase = 'end'; S.won = false;
        return;
      }
      S.w = nw; S.stepsDone++;
      popup('−' + CFG.STEP_COST + 'kg', 'bad step'); bigPop(false); SFX.step(i);
      S.shake = Math.max(S.shake, 0.18);
      // 눈 덩어리가 떨어져 나감
      for (let k = 0; k < 12; k++) {
        const sx = Math.random() < 0.5 ? -1 : 1;
        spawn(S.x + sx * S.rVis * rand(0.5, 0.9), S.y + rand(-0.2, 0.6) * S.rVis, S.z + S.rVis * rand(0, 0.6),
          sx * rand(1.5, 4), rand(2, 5), rand(1.5, 4.5), rand(0.18, 0.42), rand(1.2, 1.8));
      }
      burst(S.x, S.y, S.z, 14, { spread: 3, up: 4, size: [0.05, 0.12], life: [0.5, 0.9], grav: -5 });
    }
  } else if (S.z <= STOP_Z) {
    S.z = STOP_Z; S.phase = 'end'; S.won = true; S.smR = Math.max(0.6, S.rVis);
    SFX.win(); bgmDuck(3.2);
    burst(0, star.position.y, TREE_Z, 70, { spread: 6, up: 9, size: [0.1, 0.22], life: [1.5, 2.6], grav: -6, colors: [0xff5b6e, 0xffd84a, 0x4aa3ff, 0x6fd08c, 0xffffff, 0xb98cff] });
    S.starSpin = 8;
  }
}

const _rq = new THREE.Quaternion(), _ax = new THREE.Vector3();
function updateBall(dt) {
  S.r = S.ballGone ? 0 : radiusOf(S.w);
  const acc = 150 * (S.r - S.rVis) - 13 * S.rVel;
  S.rVel += acc * dt; S.rVis = Math.max(0, S.rVis + S.rVel * dt);
  ball.scale.setScalar(Math.max(0.0001, S.rVis));
  ball.visible = S.rVis > 0.02;
  const gy = (S.phase === 'stairs' || S.phase === 'end' || S.phase === 'result') && S.stepsDone > 0 ? S.stepsDone * CFG.STEP_H : 0;
  S.y += (gy + S.rVis - S.y) * damp(13, dt);
  ballGroup.position.set(S.x, S.y, S.z);
  // 굴러가는 회전
  const dx = S.x - S.prevX, dz = S.z - S.prevZ, d = Math.hypot(dx, dz);
  if (d > 1e-5 && S.rVis > 0.05) {
    _ax.set(dz, 0, -dx).normalize();
    ball.quaternion.premultiply(_rq.setFromAxisAngle(_ax, d / S.rVis));
  }
  S.prevX = S.x; S.prevZ = S.z;
  ballMat.emissiveIntensity = 0.18;
}

function updateMonkey(dt) {
  const moving = S.phase === 'run' || S.phase === 'stairs';
  const r = Math.max(S.rVis, 0.3);
  // 눈덩이 뒤에서 손이 닿는 위치 계산
  if (!S.ballGone && !(S.won && S.endT > 0.4)) {
    const mg0 = groundH(S.mZ);
    const dy = (mg0 + HAND_Y) - S.y;
    const dz = Math.abs(dy) < r ? Math.sqrt(r * r - dy * dy) : 0.15;
    const tz = S.z + dz + REACH;
    if (S.phase === 'title') S.mZ = tz; else S.mZ += (tz - S.mZ) * damp(18, dt);
  }
  const prevMX = S.mX;
  const cheerSide = S.won && S.endT > 0.4;
  if (cheerSide) S.mZ += (S.z + 0.6 - S.mZ) * damp(4, dt);
  S.mX += ((cheerSide ? S.x + S.rVis + 0.9 : S.x) - S.mX) * damp(cheerSide ? 4 : 9, dt);
  S.mVX = (S.mX - prevMX) / Math.max(dt, 1e-4);
  const mg = groundH(S.mZ - 0.1);
  S.mY += (mg - S.mY) * damp(11, dt);

  // 방향 (타이틀/환호 땐 카메라 쪽)
  const faceCam = S.phase === 'title' || (S.phase === 'end' || S.phase === 'result') && S.endT > 0.5;
  const targetRot = faceCam ? Math.PI : clamp(-S.mVX * 0.03, -0.5, 0.5);
  S.mRotY += (targetRot - S.mRotY) * damp(6, dt);

  M.t += dt;
  const t = M.t;
  let bob = 0, lean = 0, armL = 0.15, armR = 0.15, armZL = 0, armZR = 0, legA = 0, headX = 0, tailW = Math.sin(t * 5) * 0.25, sproutW = Math.sin(t * 6) * 0.15;
  if (moving) {
    const f = 13 * (S.speed / CFG.SPEED);
    M.run = (M.run || 0) + dt * f;
    const ph = M.run;
    bob = Math.abs(Math.sin(ph)) * 0.09;
    lean = -0.25;
    legA = Math.sin(ph) * 0.75;
    armL = 0.12 + Math.sin(ph) * 0.07; armR = 0.12 - Math.sin(ph) * 0.07;
    tailW = Math.sin(ph * 0.5) * 0.45;
    sproutW = Math.sin(ph + 1) * 0.3;
    headX = Math.sin(ph * 2) * 0.04;
  } else if (S.phase === 'title') {
    bob = Math.abs(Math.sin(t * 3)) * 0.04;
    armR = 1.4 + Math.sin(t * 8) * 0.12; armZR = -0.4 + Math.sin(t * 8) * 0.35;
    armL = -1.2;
    headX = Math.sin(t * 2) * 0.06;
  } else if (S.won) {
    bob = Math.abs(Math.sin(t * 7)) * 0.45;
    armL = armR = 1.45 + Math.sin(t * 14) * 0.15; armZL = 0.35; armZR = -0.35;
    legA = Math.sin(t * 14) * 0.3;
    sproutW = Math.sin(t * 14) * 0.4;
  } else { // 실패: 시무룩
    armL = armR = -1.25; headX = 0.35; tailW = Math.sin(t * 1.5) * 0.1; sproutW = -0.2 + Math.sin(t * 2) * 0.05;
  }
  M.root.position.set(S.mX, S.mY + bob, S.mZ);
  M.root.rotation.y = S.mRotY;
  M.body.rotation.x += (lean - M.body.rotation.x) * damp(8, dt);
  M.body.rotation.z = moving ? clamp(-S.mVX * 0.04, -0.3, 0.3) : 0;
  M.head.rotation.x = headX;
  M.arms[0].rotation.x += (armL - M.arms[0].rotation.x) * damp(14, dt);
  M.arms[1].rotation.x += (armR - M.arms[1].rotation.x) * damp(14, dt);
  M.arms[0].rotation.z = armZL; M.arms[1].rotation.z = armZR;
  M.legs[0].rotation.x = legA; M.legs[1].rotation.x = -legA;
  M.tail.rotation.z = tailW;
  M.sprout.rotation.z = sproutW; M.sprout.rotation.x = moving ? 0.25 : 0;
}

const _L = new THREE.Vector3();
function updateCamera(dt, snap = false) {
  let pitch, dist;
  if (S.phase === 'title') { pitch = 0.4; dist = 6.4; _L.set(S.mX, 1.1, S.mZ - 0.7); }
  else if (S.phase === 'run') { pitch = 1.0; dist = 14.5 + S.rVis * 3.2; _L.set(S.x * 0.5, 0, S.z - 5.2); }
  else {
    const gy = S.stepsDone * CFG.STEP_H;
    if (S.won && S.endT > 0.3) { const R = S.smR; pitch = 0.2; dist = 15 + R * 5.2; _L.set(S.x, S.y + R * 1.7 + 0.8, S.z - 1); }
    else { pitch = 0.62; dist = 14 + S.rVis * 2.4; _L.set(0, gy + 1.2, S.z - 4.5); }
  }
  if (snap) { S.camPitch = pitch; S.camDist = dist; S.look.copy(_L); }
  else {
    const k = damp(S.won ? 2.6 : 1.8, dt);
    S.camPitch += (pitch - S.camPitch) * k; S.camDist += (dist - S.camDist) * k;
    S.look.x += (_L.x - S.look.x) * damp(5, dt);
    S.look.y += (_L.y - S.look.y) * damp(4, dt);
    S.look.z += (_L.z - S.look.z) * damp(9, dt);
  }
  camera.position.set(S.look.x, S.look.y + Math.sin(S.camPitch) * S.camDist, S.look.z + Math.cos(S.camPitch) * S.camDist);
  if (S.shake > 0.002) {
    camera.position.x += rand(-1, 1) * S.shake; camera.position.y += rand(-1, 1) * S.shake * 0.6;
    S.shake *= Math.exp(-7 * dt);
  }
  camera.lookAt(S.look);
  sky.position.copy(camera.position);
  sun.position.copy(S.look).add(SUN_OFF); sun.target.position.copy(S.look);
  snowC.copy(S.look);
}

function updateHUD(dt) {
  S.shownW += (S.w - S.shownW) * damp(12, dt);
  if (Math.abs(S.w - S.shownW) < 0.05) S.shownW = S.w;
  const txt = fmt(S.shownW);
  if (txt !== S.lastText) { wNum.textContent = txt; if (S.lastText) smallPop(); S.lastText = txt; }
  const p = clamp(-S.z / -STOP_Z, 0, 1);
  progFill.style.width = (p * 100) + '%';
  progMong.style.left = (p * 100) + '%';
}

function showResult() {
  S.resultShown = true; S.phase = 'result';
  const final = Math.floor(S.w * 10) / 10;
  const best = loadBest(), isNew = final > best && final > 0;
  if (isNew) saveBest(final);
  $('rHead').textContent = S.won ? '눈사람 완성! ⛄' : '앗, 눈이 다 녹았어!';
  $('rHead').style.color = S.won ? '#2f9a5a' : '#d94a5c';
  $('rWeight').textContent = fmt(final) + 'kg';
  $('rSteps').textContent = S.stepsDone + ' / ' + CFG.STEPS + '칸';
  $('rBest').textContent = fmt(Math.max(best, final)) + 'kg';
  $('rNew').classList.toggle('hidden', !isNew);
  const r = $('result'); r.classList.remove('hidden');
  requestAnimationFrame(() => requestAnimationFrame(() => r.classList.add('show')));
  hud.classList.remove('on');
  SFX.result();
}

// =====================================================================
//  메인 루프 (+ 느린 기기면 해상도 자동 조절)
// =====================================================================
const clock = new THREE.Clock();
let perfAcc = 0, perfN = 0;
function frame() {
  requestAnimationFrame(frame);
  const rawDt = clock.getDelta();
  const dt = Math.min(rawDt, 0.05);
  S.t += dt;

  if (S.phase === 'run') updateRun(dt);
  else if (S.phase === 'stairs') updateStairs(dt);
  else if (S.phase === 'end') { S.endT += dt; if (S.endT > (S.won ? 4.8 : 2.4) && !S.resultShown) showResult(); }
  else if (S.phase === 'result') S.endT += dt;

  updateBall(dt);
  updateSnowman();
  updateMonkey(dt);
  updateCamera(dt);
  updateParticles(dt);
  updateSnow(dt, S.t);
  updateTweens(dt);
  if (S.phase !== 'title') updateHUD(dt);

  for (const tw of twinkles) {
    const k = 0.5 + 0.5 * Math.sin(S.t * 3.1 + tw.ph) * Math.sin(S.t * 1.3 + tw.ph * 1.7);
    tw.mat.color.copy(tw.base).multiplyScalar(0.45 + 0.9 * k);
    tw.glow.opacity = 0.18 + 0.6 * k;
  }
  S.starSpin += (0.6 - S.starSpin) * damp(0.8, dt);
  star.rotation.y += S.starSpin * dt;
  starGlow.material.opacity = 0.55 + Math.sin(S.t * 2.5) * 0.2;
  const sg = 6 + Math.sin(S.t * 2.5) * 0.6; starGlow.scale.set(sg, sg, 1);

  renderer.render(scene, camera);

  // 적응형 해상도
  perfAcc += rawDt; perfN++;
  if (perfN >= 90) {
    const avg = perfAcc / perfN;
    if (avg > 1 / 45 && pixelRatio > 1) { pixelRatio = Math.max(1, pixelRatio - 0.25); renderer.setPixelRatio(pixelRatio); renderer.setSize(W, H, false); }
    perfAcc = 0; perfN = 0;
  }
}

// =====================================================================
//  시작
// =====================================================================
try { await Promise.race([document.fonts.load('96px Jua'), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
buildWorld();
resetGame('title');
showTitleBest();
window.__ready = true;
$('loadMsg').remove();
frame();
</script>
</body>
